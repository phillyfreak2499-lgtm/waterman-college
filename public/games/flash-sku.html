<style>
:root{
  --navy:#0f1c28; --ink:#1a2a36; --teal:#2a9b8f; --teal-deep:#1e746b;
  --cream:#f3ede3; --gold:#e8b423; --paper:#f7f3ec;
  --good:#2f7d57; --miss:#9b3b32;
  --muted:#9aa7b0; --surface:#173041; --border:rgba(243,237,227,.14);
  --display:"Fraunces","Iowan Old Style",Palatino,Georgia,serif;
  --sans:"Outfit","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--navy);color:var(--cream);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:disabled{opacity:.45;cursor:default}
img{display:block;max-width:100%}
h1,h2{font-family:var(--display);letter-spacing:-.03em;line-height:1.15;margin:0;font-weight:500}
p{margin:0}
.page{max-width:40rem;margin:0 auto;padding:1.1rem 1rem 3.5rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:1rem}
.kicker{font-size:.7rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--teal)}
.muted{color:var(--muted);font-size:.9rem;line-height:1.55}
.display{font-style:italic;font-size:clamp(2.4rem,8vw,3.6rem)}
.hero-shot{overflow:hidden;border-radius:28px;border:1px solid var(--border);background:var(--gold);margin-bottom:1.25rem}
.hero-shot img{width:100%;aspect-ratio:16/9;object-fit:cover;object-position:center 35%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:52px;padding:0 1.15rem;border-radius:16px;font-weight:600}
.btn.cream{background:var(--cream);color:var(--ink)}
.btn.ghost{border:1px solid var(--border);color:var(--cream)}
.row{display:flex;flex-direction:column;gap:.5rem;margin-top:1rem}
@media(min-width:640px){.row{flex-direction:row}.row .btn{flex:1}}
.tips{margin:1.25rem 0 0;padding:0;list-style:none;display:grid;gap:.65rem}
.tips li{color:var(--muted);font-size:.9rem;line-height:1.5;border-left:2px solid rgba(42,155,143,.7);padding-left:.85rem}
.hud{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem}
.time{font-family:var(--display);font-size:2.4rem;font-variant-numeric:tabular-nums}
.bar{height:4px;border-radius:999px;background:var(--surface);overflow:hidden;margin:.75rem 0 1rem}
.bar>i{display:block;height:100%;background:var(--teal);width:0}
.paper{overflow:hidden;border-radius:28px;border:1px solid var(--border);background:var(--paper);position:relative}
.paper img{height:12rem;width:100%;object-fit:contain}
@media(min-width:640px){.paper img{height:14rem}}
.chip{position:absolute;left:.75rem;top:.75rem;border-radius:999px;background:rgba(15,28,40,.85);padding:.35rem .75rem;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase}
.banner{position:absolute;inset:auto 0 0 0;padding:.75rem 1rem;color:var(--cream)}
.banner.ok{background:rgba(47,125,87,.92)}
.banner.no{background:rgba(155,59,50,.92)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.75rem}
.choice{min-height:3.5rem;border-radius:16px;border:1px solid var(--border);background:var(--surface);padding:.7rem .8rem;text-align:left}
.choice .fam{display:block;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.choice.on{border-color:var(--good);background:rgba(47,125,87,.2)}
.choice.miss{border-color:var(--miss);background:rgba(155,59,50,.2)}
.choice.dim{opacity:.5}
.sku-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
@media(min-width:640px){.sku-grid{grid-template-columns:1fr 1fr 1fr}}
.sku-card{overflow:hidden;border-radius:20px;border:1px solid var(--border);background:var(--surface);text-align:left}
.sku-card .ph{background:var(--paper)}
.sku-card img{height:7rem;width:100%;object-fit:contain}
.sku-card .pad{padding:.55rem .7rem}
.detail{margin-top:1rem;border-radius:24px;background:var(--cream);color:var(--ink);padding:1rem 1.1rem}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem}
.stat{border-radius:20px;background:var(--surface);padding:.75rem}
.stat b{display:block;font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums;margin-top:.2rem}
.miss-row{display:flex;gap:.75rem;align-items:center;border-radius:18px;background:var(--surface);padding:.55rem .7rem;margin:.45rem 0}
.miss-row img{height:3.4rem;width:4.6rem;object-fit:contain;background:var(--paper);border-radius:10px}
.sku-row{display:flex;gap:.7rem;align-items:stretch;border:1px solid var(--border);background:var(--surface);border-radius:20px;padding:.4rem;margin:.4rem 0}
.sku-row.off{opacity:.55}
.sku-row img{height:5.5rem;width:6.5rem;object-fit:contain;background:var(--paper);border-radius:14px}
.sku-row .meta{flex:1;min-width:0;padding:.2rem 0}
.sku-row select{width:100%;margin-top:.4rem;min-height:36px;border-radius:10px;border:1px solid var(--border);background:var(--navy);color:var(--cream);font:inherit;font-size:.75rem}
.wall-btn{width:4.2rem;border-radius:14px;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;background:rgba(42,155,143,.15);color:var(--teal)}
.sku-row.off .wall-btn{background:var(--navy);color:var(--muted)}
.never{border:1px solid var(--border);border-radius:20px;background:var(--surface);overflow:hidden}
.never li{padding:.75rem 1rem;border-top:1px solid var(--border);list-style:none}
.never li:first-child{border-top:0}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:1rem 0}
.chip-n{border-radius:999px;padding:.3rem .75rem;font-size:.8rem;background:var(--surface);color:var(--muted)}
.chip-n.on{background:rgba(42,155,143,.15);color:var(--teal)}
.chip-n.no{background:rgba(155,59,50,.15);color:#e8a39c}

</style>
