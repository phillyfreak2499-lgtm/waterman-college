<style>
:root{
  --navy:#0f1c28; --ink:#1a2a36; --teal:#2a9b8f; --teal-deep:#1e746b;
  --cream:#f3ede3; --paper:#f7f3ec; --good:#2f7d57; --miss:#9b3b32;
  --muted:#9aa7b0; --surface:#173041; --border:rgba(243,237,227,.14);
  --display:"Fraunces","Iowan Old Style",Palatino,Georgia,serif;
  --sans:"Outfit","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--navy);color:var(--cream);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:disabled{opacity:.45;cursor:default}
h1,h2{font-family:var(--display);letter-spacing:-.03em;line-height:1.15;margin:0;font-weight:500}
p{margin:0}
.page{max-width:56rem;margin:0 auto;padding:1rem .85rem 6rem}
.kicker{font-size:.7rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--teal)}
.muted{color:var(--muted);font-size:.9rem;line-height:1.55}
.display{font-style:italic;font-size:clamp(2.2rem,7vw,3.4rem)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:52px;padding:0 1.15rem;border-radius:16px;font-weight:600}
.btn.cream{background:var(--cream);color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--cream)}
.modes{display:grid;gap:.75rem;margin:1rem 0}
@media(min-width:640px){.modes{grid-template-columns:1fr 1fr}}
.mode{border-radius:24px;border:1px solid var(--border);background:var(--surface);padding:1.1rem;text-align:left}
.mode.on{border-color:var(--teal);background:rgba(42,155,143,.18)}
.names{display:grid;gap:.75rem;margin:1rem 0}
@media(min-width:640px){.names{grid-template-columns:1fr 1fr}}
label{display:flex;flex-direction:column;gap:.4rem;font-size:.85rem;color:var(--muted)}
input{height:48px;border-radius:14px;border:1px solid var(--border);background:var(--surface);color:var(--cream);padding:0 1rem;font:inherit}
.tips{display:grid;gap:.65rem;margin:1rem 0 1.25rem}
@media(min-width:640px){.tips{grid-template-columns:1fr 1fr}}
.tip{border-radius:20px;border:1px solid var(--border);background:var(--surface);padding:.85rem 1rem}
.hud{display:grid;gap:.65rem;margin:.75rem 0}
@media(min-width:640px){.hud{grid-template-columns:1fr 1fr}}
.seat{display:flex;align-items:center;justify-content:space-between;border-radius:20px;border:1px solid var(--border);background:var(--surface);padding:.7rem 1rem;gap:.6rem}
.seat.on{border-color:var(--teal);background:rgba(42,155,143,.18)}
.chip{width:1.9rem;height:1.9rem;border-radius:999px;display:grid;place-items:center;font-size:.7rem;font-weight:700;border:1px solid var(--navy)}
.chip.a{background:var(--teal);color:var(--cream)}
.chip.b{background:var(--cream);color:var(--ink)}
.chip.on{box-shadow:0 0 0 2px rgba(243,237,227,.8)}
.chip.sm{width:1.45rem;height:1.45rem;font-size:.58rem}
.board-wrap{border-radius:24px;border:1px solid var(--border);background:var(--ink);padding:.55rem}
.door-row{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.15rem .25rem .45rem}
.door-left{display:flex;align-items:center;gap:.45rem}
.board{display:flex;gap:.4rem}
.ylabels{width:3rem;display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.ylabels span{flex:1;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-size:8px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:right;line-height:1.1}
@media(min-width:640px){.ylabels{width:4rem}.ylabels span{font-size:10px}}
.stage{position:relative;flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}
.sq{position:relative;min-height:2.25rem;border-radius:7px}
@media(min-width:640px){.sq{aspect-ratio:1;min-height:0;border-radius:10px}}
.sq.door{background:var(--surface)}
.sq.step{background:rgba(42,155,143,.2)}
.sq.chart{background:var(--navy)}
.sq.place{background:rgba(42,155,143,.28)}
.sq.close{background:rgba(47,125,87,.3);box-shadow:inset 0 0 0 1px var(--teal)}
.sq.land{box-shadow:inset 0 0 0 1px rgba(243,237,227,.7)}
.num{position:absolute;left:3px;top:1px;font-size:8px;color:rgba(243,237,227,.5);font-variant-numeric:tabular-nums}
.warps{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.tokens{position:absolute;inset:0;pointer-events:none}
.token{position:absolute;transform:translate(-50%,-50%);transition:left .25s cubic-bezier(.23,1,.32,1),top .25s cubic-bezier(.23,1,.32,1)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;border-top:1px solid var(--border);background:rgba(15,28,40,.95);padding:.75rem .85rem calc(.75rem + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;align-items:center;gap:.7rem}
@media(min-width:640px){.bar{position:static;border:0;background:none;padding:.9rem 0 0}.page{padding-bottom:2.5rem}}
.die{width:3.4rem;height:3.4rem;border-radius:14px;background:var(--cream);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:2px;padding:8px;flex-shrink:0;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.pip{width:7px;height:7px;border-radius:999px;margin:auto}
.pip.on{background:var(--ink)}
.die.tumble{animation:tumble 80ms ease-out}
@keyframes tumble{0%{transform:rotate(-18deg) scale(.92)}50%{transform:rotate(14deg) scale(1.06)}100%{transform:rotate(0) scale(1)}}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(15,28,40,.72);padding:.75rem}
@media(min-width:640px){.sheet{align-items:center}}
.card{width:100%;max-width:32rem;max-height:90dvh;overflow:auto;border-radius:28px;background:var(--cream);color:var(--ink);padding:1.2rem;animation:sheet .25s cubic-bezier(.22,1,.36,1)}
@keyframes sheet{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
.choice{min-height:3.4rem;border-radius:18px;border:1px solid #d9d0c4;background:var(--paper);padding:.7rem .85rem;text-align:left;width:100%;margin:.35rem 0;color:var(--ink)}
.choice.gold{border-color:var(--good);background:rgba(47,125,87,.15)}
.choice.bad{border-color:var(--miss);background:rgba(155,59,50,.15)}
.choice.dim{opacity:.55}
.back{min-height:44px;color:var(--muted);margin-bottom:.5rem;display:inline-flex;align-items:center}
.back:hover{color:var(--cream)}
.stat{border-radius:24px;background:var(--surface);padding:1rem 1.1rem}
.stat.win{background:rgba(42,155,143,.2);box-shadow:inset 0 0 0 1px var(--teal)}
.log{border-radius:16px;background:var(--surface);padding:.75rem 1rem;margin-top:.7rem}
@media(prefers-reduced-motion:reduce){
  .token{transition:none}
  .card,.die.tumble{animation:none}
}
</style>

    var html = '<div class="board-wrap"><div class="door-row"><div class="door-left"><span class="kicker">Door</span>';
    state.seats.forEach(function (s, i) {
      html += '<span style="opacity:' + (s.pos === 0 ? "1" : ".25") + '">' + chip(i, S.initials(s.name), s.pos === 0 && i === state.turn, true) + "</span>";
    });
    html += '</div><span class="muted" style="font-size:10px;letter-spacing:.14em;text-transform:uppercase">Teal climbs · Red slides · Exact 50</span></div>';
    html += '<div class="board"><div class="ylabels">';
    for (var row = 0; row < S.ROWS; row++) html += "<span>" + esc(S.rowZone(row)) + "</span>";
    html += '</div><div class="stage"><div class="grid">';
    for (var i = 0; i < S.ROWS * S.COLS; i++) {
      var r = Math.floor(i / S.COLS);
      var col = i % S.COLS;
      var n = squaresAt(r, col);
      html += '<div class="sq ' + zoneClass(n) + (state.land === n ? " land" : "") + '" data-qa="square-' + n + '">';
      html += '<span class="num">' + n + "</span>";
      if (n === S.LAST_SQUARE) html += '<span class="num" style="left:auto;right:3px;top:auto;bottom:2px;color:var(--teal)">Close</span>';
      html += "</div>";
    }
    html += "</div>" + warpSvg() + tokensHtml() + "</div></div></div>";
    return html;
  }

  function cardHtml() {
    if (state.phase !== "card" || !state.card) return "";
    var c = state.card;
    var w = state.warp;
    var locked = !!state.picked;
    var ladder = c.kind === "ladder";
    var html = '<div class="sheet"><div class="card">';
    html += '<p class="kicker" style="color:' + (ladder ? "var(--teal-deep)" : "var(--miss)") + '">' + (state.forced ? "Pushed the 4th — automatic slide" : (ladder ? "Ladder " + w.from + " → " + w.to : "Shout " + w.from + " → " + w.to)) + "</p>";
    html += "<h2>" + esc(c.title) + "</h2>";
    html += '<p class="muted" style="color:rgba(26,42,54,.7);margin-top:.5rem">' + esc(c.hear) + "</p>";
    if (!state.forced) {
    state.picks.forEach(function (p, i) {
      var gold = S.isGold(c, p);
      var cls = "choice";
      if (locked && gold) cls += " gold";
      if (locked && !gold && state.picked === p) cls += " bad";
      if (locked && !gold && state.picked !== p) cls += " dim";
      html += '<button class="' + cls + '" data-qa="choice" data-pick-i="' + i + '" ' + (locked ? "disabled" : "") + ">" + esc(p) + "</button>";
    });
    }
    if (locked) {
      html += '<p style="margin-top:.9rem;line-height:1.5">' + esc(c.why) + "</p>";
      var label = ladder ? (S.isGold(c, state.picked) ? "Climb" : "Stay") : (S.isGold(c, state.picked) ? "Hold" : "Slide");
      html += '<button class="btn dark" data-qa="card-continue" style="width:100%;margin-top:1rem">' + label + "</button>";
    }
    html += "</div></div>";
    return html;
  }

  function render() {
    if (state.phase === "intro") {
      var preview = S.dealSeats(state.mode, state.names);
      var hold = state.seats;
      state.seats = preview;
      var mini = boardHtml();
      state.seats = hold;
      app.innerHTML =
        '<a class="back" href="/quad">Quad</a>' +
        '<p class="kicker">Two chairs · one board</p>' +
        '<h1 class="display">Shouts and Ladders</h1>' +
        '<p class="muted" style="max-width:36rem;margin:.75rem 0 1rem">Ladders build value. Shouts dump it. Spend a visit pip to ask again after you see the square. The stronger visit keeps the chair. Push the 4th after a climb — a shout on that roll auto-slides. Exact 50 only closes if the visit has value.</p>' +
        mini +
        '<div class="modes">' +
          '<button class="mode' + (state.mode === "duo" ? " on" : "") + '" data-qa="mode-duo" data-mode="duo"><h2>Two specialists</h2><p class="muted">Pass the iPad. First to Continuity wins.</p></button>' +
          '<button class="mode' + (state.mode === "solo" ? " on" : "") + '" data-qa="mode-solo" data-mode="solo"><h2>You vs Register</h2><p class="muted">The bot talks like a ticket. Beat it to 50.</p></button>' +
        "</div>" +
        '<div class="names"><label>Chair 1<input data-qa="name-1" value="' + esc(state.names[0]) + '"/></label>' +
        (state.mode === "duo" ? '<label>Chair 2<input data-qa="name-2" value="' + esc(state.names[1]) + '"/></label>' : "") +
        "</div>" +
        '<div class="tips"><div class="tip"><p>Ladder</p><p class="muted">Gold climbs and adds a visit pip.</p></div>' +
        '<div class="tip"><p>Shout</p><p class="muted">Catch it and hold. Miss slides and dumps a pip.</p></div>' +
        '<div class="tip"><p>Ask again</p><p class="muted">See the square, then spend 1 pip to reroll once.</p></div>' +
        '<div class="tip"><p>Chair · 4th · Continuity</p><p class="muted">Higher visit keeps the chair. Push the 4th at your risk. Close needs 2 pips or 2 ladders.</p></div></div>' +
        (state.best ? '<p class="muted">Best value score on this device: ' + state.best + "</p>" : "") +
        '<button class="btn cream" data-qa="start">Roll for the door</button>';
      return;
    }
    if (state.phase === "done") {
      var ranked = state.seats.slice().sort(function (a, b) { return S.scoreSeat(b) - S.scoreSeat(a); });
      var top = ranked[0];
      var rows = ranked.map(function (s, i) {
        return '<div class="stat' + (i === 0 ? " win" : "") + '"><h2>' + esc(s.name) + "</h2><p class=\"muted\">Square " + s.pos + " · visit " + s.value + " · " + s.climbs + " ladders · " + s.shoutsCaught + " shouts caught · " + s.shoutsMissed + " dropped</p><p style=\"margin-top:.4rem;color:var(--teal);font-size:1.2rem\">" + S.scoreSeat(s) + "</p></div>";
      }).join("");
      app.innerHTML =
        '<a class="back" href="/quad">Quad</a>' +
        '<p class="kicker">Continuity</p>' +
        '<h1 class="display">' + esc(top.name) + " holds the value</h1>" +
        '<p class="muted" style="margin:.75rem 0 1rem">First to the close without dumping the visit.</p>' +
        boardHtml() +
        '<div class="modes">' + rows + "</div>" +
        '<button class="btn cream" data-qa="again">Same chairs</button>';
      return;
    }
    var seats = state.seats.map(function (s, i) {
      var sub = s.pos === 0 ? "At the door" : S.zoneOf(s.pos) + " · " + s.pos;
      return '<div class="seat' + (i === state.turn ? " on" : "") + '"><div style="display:flex;gap:.7rem;align-items:center">' + chip(i, S.initials(s.name), i === state.turn, false) + "<div><p>" + esc(s.name) + "</p><p class=\"muted\">" + esc(sub) + "</p>" + pips(s.value) + "</div></div></div>";
    }).join("");
    var seat = state.seats[state.turn];
    var need = S.needForClose(seat.pos);
    var hint = seat.kind === "bot"
      ? S.BOT_NAME + " is rolling."
      : (seat.pos > 0 && need <= 6)
        ? "Need exact " + need + " · visit " + S.CLOSE_VALUE + "+ or 2 ladders to close."
        : seat.pos === 0
          ? esc(seat.name) + " — step onto the floor."
          : esc(seat.name) + " — pass the iPad.";
    var decide = state.motion === "decide" && seat.kind === "human" && state.peek;
    var rollLabel = state.motion === "rolling" ? "Rolling…" : state.motion === "moving" ? "Walking…" : "Roll";
    var disabled = lock || state.motion !== "idle" || state.phase !== "play" || seat.kind !== "human";
    var barBtns = decide
      ? '<button class="btn cream" data-qa="walk">Walk it</button>' + (seat.value >= 1 && !state.rerolled ? '<button class="btn cream" data-qa="reroll" style="background:transparent;border:1px solid var(--border);color:var(--cream)">Ask again</button>' : "")
      : '<button class="btn cream" data-qa="roll"' + (disabled ? " disabled" : "") + ">" + rollLabel + "</button>";
    app.innerHTML =
      '<a class="back" href="/quad">Quad</a>' +
      '<p class="kicker">Shouts and Ladders</p>' +
      '<div class="hud">' + seats + "</div>" +
      boardHtml() +
      (state.log ? '<p class="log">' + esc(state.log) + "</p>" : "") +
      '<div class="bar">' + dieHtml() +
        barBtns +
        '<p class="muted">' + (decide ? "Rolled " + state.die + ". " + esc(S.peekLabel(state.peek)) : hint) + "</p>" +
      "</div>" +
      (seat.kind === "bot" && state.phase === "card" ? '<p class="muted" style="margin-top:.6rem">' + S.BOT_NAME + " is reading the card…</p>" : "") +
      cardHtml() + extraSheets();
  }

  app.addEventListener("click", function (e) {
    var t = e.target.closest("[data-mode],[data-qa]");
    if (!t) return;
    if (t.getAttribute("data-mode")) {
      state.mode = t.getAttribute("data-mode");
      render();
      return;
    }
    var qa = t.getAttribute("data-qa");
    if (qa === "start" || qa === "again") { start(); return; }
    if (qa === "roll") { takeTurn(); return; }
    if (qa === "walk") { walkIt(); return; }
    if (qa === "reroll") { askAgain(); return; }
    if (qa === "hold") {
      state.phase = "play";
      state.log = state.seats[state.turn].name + " held the system.";
      advance();
      return;
    }
    if (qa === "push") {
      state.greedy = true;
      state.phase = "play";
      lock = false;
      cardLock = false;
      state.motion = "idle";
      takeTurn();
      return;
    }
    if (qa === "clash-continue") { resolveClash(); return; }
    if (qa === "choice" && t.getAttribute("data-pick-i") != null) {
      state.picked = state.picks[Number(t.getAttribute("data-pick-i"))];
      render();
      return;
    }
    if (qa === "card-continue" && state.picked) { resolve(state.picked); return; }
  });
  app.addEventListener("input", function (e) {
    var el = e.target;
    if (el.getAttribute("data-qa") === "name-1") state.names[0] = el.value;
    if (el.getAttribute("data-qa") === "name-2") state.names[1] = el.value;
  });

  render();
})();
</script>
</body>
</html>
