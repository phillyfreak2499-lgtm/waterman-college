<html lang="en">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"/>

<style>
:root{
  --navy:#0f1c28; --ink:#1a2a36; --teal:#2a9b8f; --teal-deep:#1e746b;
  --cream:#f3ede3; --paper:#f7f3ec; --good:#2f7d57; --miss:#9b3b32;
  --muted:#9aa7b0; --surface:#173041; --border:rgba(243,237,227,.14);
  --display:"Fraunces","Iowan Old Style",Palatino,Georgia,serif;
  --sans:"Outfit","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--navy);color:var(--cream);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:disabled{opacity:.45;cursor:default}
h1,h2{font-family:var(--display);letter-spacing:-.03em;line-height:1.15;margin:0;font-weight:500}
p{margin:0}
.page{max-width:56rem;margin:0 auto;padding:1rem .85rem 3.5rem}
.kicker{font-size:.7rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--teal)}
.muted{color:var(--muted);font-size:.9rem;line-height:1.55}
.display{font-style:italic;font-size:clamp(2.2rem,7vw,3.4rem)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:52px;padding:0 1.15rem;border-radius:16px;font-weight:600}
.btn.cream{background:var(--cream);color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--cream)}
.btn.ghost{border:1px solid var(--border);color:var(--cream)}
.modes{display:grid;gap:.75rem;margin:1rem 0}
@media(min-width:640px){.modes{grid-template-columns:1fr 1fr}}
.mode{border-radius:24px;border:1px solid var(--border);background:var(--surface);padding:1.1rem;text-align:left}
.mode.on{border-color:var(--teal);background:rgba(42,155,143,.18)}
.names{display:grid;gap:.75rem;margin:1rem 0}
@media(min-width:640px){.names{grid-template-columns:1fr 1fr}}
label{display:flex;flex-direction:column;gap:.4rem;font-size:.85rem;color:var(--muted)}
input{height:48px;border-radius:14px;border:1px solid var(--border);background:var(--surface);color:var(--cream);padding:0 1rem;font:inherit}
.tips{display:grid;gap:.65rem;margin:1rem 0 1.25rem}
@media(min-width:640px){.tips{grid-template-columns:1fr 1fr}}
.tip{border-radius:20px;border:1px solid var(--border);background:var(--surface);padding:.85rem 1rem}
.hud{display:grid;gap:.65rem;margin:.75rem 0}
@media(min-width:640px){.hud{grid-template-columns:1fr 1fr}}
.seat{display:flex;align-items:center;justify-content:space-between;border-radius:20px;border:1px solid var(--border);background:var(--surface);padding:.7rem 1rem}
.seat.on{border-color:var(--teal);background:rgba(42,155,143,.18)}
.dot{width:1.9rem;height:1.9rem;border-radius:999px;display:grid;place-items:center;font-size:.75rem;font-weight:600}
.dot.a{background:var(--teal);color:var(--cream)}
.dot.b{background:var(--cream);color:var(--ink)}
.board{overflow:hidden;border-radius:24px;border:1px solid var(--border);background:var(--ink);padding:.5rem}
.grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}
.sq{position:relative;aspect-ratio:1;border-radius:8px}
.sq.door,.sq.chart{background:var(--surface)}
.sq.step,.sq.place{background:rgba(42,155,143,.22)}
.sq.close{background:rgba(47,125,87,.28);box-shadow:inset 0 0 0 1px var(--teal)}
.num{position:absolute;left:3px;top:1px;font-size:9px;color:rgba(243,237,227,.55);font-variant-numeric:tabular-nums}
.mark{position:absolute;right:2px;top:1px;font-size:10px}
.mark.up{color:var(--teal)}
.mark.down{color:var(--miss)}
.pawns{position:absolute;inset:auto 0 3px 0;display:flex;justify-content:center;gap:2px}
.pawn{width:11px;height:11px;border-radius:999px;border:1px solid var(--navy)}
.pawn.a{background:var(--teal)}
.pawn.b{background:var(--cream)}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(15,28,40,.72);padding:.75rem}
@media(min-width:640px){.sheet{align-items:center}}
.card{width:100%;max-width:32rem;border-radius:28px;background:var(--cream);color:var(--ink);padding:1.2rem}
.choice{min-height:3.4rem;border-radius:18px;border:1px solid #d9d0c4;background:var(--paper);padding:.7rem .85rem;text-align:left;width:100%;margin:.35rem 0;color:var(--ink)}
.choice.gold{border-color:var(--good);background:rgba(47,125,87,.15)}
.choice.bad{border-color:var(--miss);background:rgba(155,59,50,.15)}
.choice.dim{opacity:.55}
.back{min-height:44px;color:var(--muted);margin-bottom:.5rem}
.back:hover{color:var(--cream)}
.stat{border-radius:24px;background:var(--surface);padding:1rem 1.1rem}
</style>
</head>

    }
  }

  async function takeTurn() {
    if (lock || state.phase !== "play") return;
    var seat = state.seats[state.turn];
    if (!seat) return;
    lock = true;
    var roll = S.rollDie();
    state.die = roll;
    render();
    await sleep(280);
    var path = S.tryRoll(seat.pos, roll);
    if (!path.length) {
      state.log = seat.name + " rolled " + roll + " — need exact for Continuity.";
      render();
      await sleep(400);
      advance();
      return;
    }
    await walk(state.turn, path);
    var land = path[path.length - 1];
    if (land >= S.LAST_SQUARE) { finish(); return; }
    var w = S.warpAt(land);
    if (!w) {
      state.log = seat.name + " to " + land + " · " + S.zoneOf(land) + ".";
      render();
      await sleep(220);
      advance();
      return;
    }
    var c = S.cardOf(w.cardId);
    state.warp = w;
    state.card = c;
    state.picks = S.choicesFor(c, state.seed + "-" + state.turn + "-" + land);
    state.picked = null;
    state.phase = "card";
    lock = false;
    render();
    if (seat.kind === "bot") {
      await sleep(700);
      var pick = S.botPicksGold(c) ? c.gold : c.misses[0];
      await resolve(pick);
    }
  }

  async function walk(idx, path) {
    for (var i = 0; i < path.length; i++) {
      state.seats[idx].pos = path[i];
      render();
      await sleep(90);
    }
  }

  async function resolve(pick) {
    if (cardLock) return;
    cardLock = true;
    state.picked = pick;
    render();
    await sleep(240);
    var c = state.card;
    var w = state.warp;
    var ok = S.isGold(c, pick);
    var climb = c.kind === "ladder" && ok;
    var slide = c.kind === "shout" && !ok;
    var caught = c.kind === "shout" && ok;
    var path = climb || slide ? S.warpPath(w.from, w.to) : [];
    state.phase = "play";
    if (path.length) await walk(state.turn, path);
    var seat = state.seats[state.turn];
    if (climb || slide) seat.pos = w.to;
    if (climb) seat.climbs += 1;
    if (caught) seat.shoutsCaught += 1;
    if (slide) seat.shoutsMissed += 1;
    state.log = climb
      ? seat.name + " built value — climbed to " + w.to + "."
      : slide
        ? seat.name + " let value drop — shout down to " + w.to + "."
        : caught
          ? seat.name + " caught the shout. Value holds at " + w.from + "."
          : seat.name + " missed the builder. Stays on " + w.from + ".";
    state.card = null;
    state.warp = null;
    if (seat.pos >= S.LAST_SQUARE) { finish(); return; }
    render();
    await sleep(220);
    advance();
  }

  function advance() {
    lock = false;
    cardLock = false;
    state.turn = (state.turn + 1) % 2;
    state.seed += 1;
    render();
    maybeBot();
  }

  function finish() {
    var ranked = state.seats.slice().sort(function (a, b) { return S.scoreSeat(b) - S.scoreSeat(a); });
    report(S.scoreSeat(ranked[0]));
    state.phase = "done";
    lock = false;
    cardLock = false;
    render();
  }

  function boardHtml() {
    var html = '<div class="board"><div class="grid">';
    for (var i = 0; i < S.ROWS * S.COLS; i++) {
      var row = Math.floor(i / S.COLS);
      var col = i % S.COLS;
      var n = squaresAt(row, col);
      var ladder = S.LADDERS.some(function (w) { return w.from === n; });
      var shout = S.SHOUTS.some(function (w) { return w.from === n; });
      var here = state.seats.filter(function (s) { return s.pos === n; });
      html += '<div class="sq ' + zoneClass(n) + '" data-qa="square-' + n + '">';
      html += '<span class="num">' + n + '</span>';
      if (ladder) html += '<span class="mark up">▲</span>';
      if (shout) html += '<span class="mark down">▼</span>';
      if (here.length) {
        html += '<span class="pawns">';
        here.forEach(function (s) {
          html += '<span class="pawn ' + (s === state.seats[0] ? "a" : "b") + '"></span>';
        });
        html += "</span>";
      }
      html += "</div>";
    }
    return html + "</div></div>";
  }

  function cardHtml() {
    if (state.phase !== "card" || !state.card) return "";
    var c = state.card;
    var w = state.warp;
    var locked = !!state.picked;
    var ladder = c.kind === "ladder";
    var html = '<div class="sheet"><div class="card">';
    html += '<p class="kicker" style="color:var(--teal-deep)">' + (ladder ? "Ladder " + w.from + " → " + w.to : "Shout " + w.from + " → " + w.to) + "</p>";
    html += "<h2>" + esc(c.title) + "</h2>";
    html += '<p class="muted" style="color:rgba(26,42,54,.7);margin-top:.5rem">' + esc(c.hear) + "</p>";
    state.picks.forEach(function (p, i) {
      var gold = S.isGold(c, p);
      var cls = "choice";
      if (locked && gold) cls += " gold";
      if (locked && !gold && state.picked === p) cls += " bad";
      if (locked && !gold && state.picked !== p) cls += " dim";
      html += '<button class="' + cls + '" data-qa="choice" data-pick-i="' + i + '" ' + (locked ? "disabled" : "") + ">" + esc(p) + "</button>";
    });
    if (locked) {
      html += '<p style="margin-top:.9rem;line-height:1.5">' + esc(c.why) + "</p>";
      var label = ladder ? (S.isGold(c, state.picked) ? "Climb" : "Stay") : (S.isGold(c, state.picked) ? "Hold" : "Slide");
      html += '<button class="btn dark" data-qa="card-continue" style="width:100%;margin-top:1rem">' + label + "</button>";
    }
    html += "</div></div>";
    return html;
  }

  function render() {
    if (state.phase === "intro") {
      app.innerHTML =
        '<a class="back" href="/quad">Quad</a>' +
        '<p class="kicker">Two chairs · one board</p>' +
        '<h1 class="display">Shouts and Ladders</h1>' +
        '<p class="muted" style="max-width:36rem;margin:.75rem 0 0">Ladders are value builders from Building Value. Shouts dump it — diagnose, discount, gym Strengthener, register 4th. Catch the shout and you stay. Miss it and you slide.</p>' +
        '<div class="modes">' +
          '<button class="mode' + (state.mode === "duo" ? " on" : "") + '" data-qa="mode-duo" data-mode="duo"><h2>Two specialists</h2><p class="muted">Pass the iPad. First to Continuity wins.</p></button>' +
          '<button class="mode' + (state.mode === "solo" ? " on" : "") + '" data-qa="mode-solo" data-mode="solo"><h2>You vs Register</h2><p class="muted">The bot talks like a ticket. Beat it to 50.</p></button>' +
        "</div>" +
        '<div class="names"><label>Chair 1<input data-qa="name-1" value="' + esc(state.names[0]) + '"/></label>' +
        (state.mode === "duo" ? '<label>Chair 2<input data-qa="name-2" value="' + esc(state.names[1]) + '"/></label>' : "") +
        "</div>" +
        '<div class="tips"><div class="tip"><p>Ladder</p><p class="muted">Name the value builder. Gold climbs. Miss stays.</p></div>' +
        '<div class="tip"><p>Shout</p><p class="muted">Catch the line that hurts value. Gold holds. Miss slides.</p></div></div>' +
        (state.best ? '<p class="muted">Best value score on this device: ' + state.best + "</p>" : "") +
        '<button class="btn cream" data-qa="start">Roll for the door</button>';
      return;
    }
    if (state.phase === "done") {
      var ranked = state.seats.slice().sort(function (a, b) { return S.scoreSeat(b) - S.scoreSeat(a); });
      var top = ranked[0];
      var rows = ranked.map(function (s) {
        return '<div class="stat"><h2>' + esc(s.name) + "</h2><p class=\"muted\">Square " + s.pos + " · " + s.climbs + " ladders · " + s.shoutsCaught + " shouts caught · " + s.shoutsMissed + " dropped</p><p style=\"margin-top:.4rem;color:var(--teal);font-size:1.2rem\">" + S.scoreSeat(s) + "</p></div>";
      }).join("");
      app.innerHTML =
        '<a class="back" href="/quad">Quad</a>' +
        '<p class="kicker">Continuity</p>' +
        '<h1 class="display">' + esc(top.name) + " holds the value</h1>" +
        '<p class="muted" style="margin:.75rem 0 1rem">First to the close without dumping the visit.</p>' +
        '<div class="modes">' + rows + "</div>" +
        '<button class="btn cream" data-qa="again">Same chairs</button>';
      return;
    }
    var seats = state.seats.map(function (s, i) {
      return '<div class="seat' + (i === state.turn ? " on" : "") + '"><div style="display:flex;gap:.7rem;align-items:center"><span class="dot ' + (i === 0 ? "a" : "b") + '">' + (i + 1) + "</span><div><p>" + esc(s.name) + "</p><p class=\"muted\">" + (s.pos ? S.zoneOf(s.pos) + " · " + s.pos : "Door") + "</p></div></div></div>";
    }).join("");
    var seat = state.seats[state.turn];
    app.innerHTML =
      '<a class="back" href="/quad">Quad</a>' +
      '<p class="kicker">Shouts and Ladders</p>' +
      '<div class="hud">' + seats + "</div>" +
      boardHtml() +
      '<div style="display:flex;flex-wrap:wrap;gap:.7rem;align-items:center;margin-top:.9rem">' +
        '<button class="btn cream" data-qa="roll"' + (lock || state.phase !== "play" || seat.kind !== "human" ? " disabled" : "") + ">" + (state.die ? "Rolled " + state.die : "Roll") + "</button>" +
        '<p class="muted">' + (seat.kind === "bot" ? S.BOT_NAME + " is rolling." : esc(seat.name) + " — pass the iPad.") + "</p>" +
      "</div>" +
      (state.log ? '<p style="margin-top:.7rem">' + esc(state.log) + "</p>" : "") +
      (seat.kind === "bot" && state.phase === "card" ? '<p class="muted" style="margin-top:.6rem">' + S.BOT_NAME + " is reading the card…</p>" : "") +
      cardHtml();
  }

  app.addEventListener("click", function (e) {
    var t = e.target.closest("[data-mode],[data-qa],[data-pick]");
    if (!t) return;
    if (t.getAttribute("data-mode")) {
      state.mode = t.getAttribute("data-mode");
      render();
      return;
    }
    var qa = t.getAttribute("data-qa");
    if (qa === "start" || qa === "again") { start(); return; }
    if (qa === "roll") { takeTurn(); return; }
    if (qa === "choice" && t.getAttribute("data-pick-i") != null) {
      state.picked = state.picks[Number(t.getAttribute("data-pick-i"))];
      render();
      return;
    }
    if (qa === "card-continue" && state.picked) { resolve(state.picked); return; }
  });
  app.addEventListener("input", function (e) {
    var el = e.target;
    if (el.getAttribute("data-qa") === "name-1") state.names[0] = el.value;
    if (el.getAttribute("data-qa") === "name-2") state.names[1] = el.value;
  });

  render();
})();
</script>
</body>
</html>
