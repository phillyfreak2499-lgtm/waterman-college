<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>The 4th — Waterman College</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="/games/quad-bridge.js"></script>
<style>
:root{
  --navy:#0f1c28; --ink:#1a2a36; --teal:#2a9b8f; --teal-deep:#1e746b;
  --cream:#f3ede3; --gold:#e8b423; --paper:#f7f3ec; --rule:#d9d0c4;
  --good:#2f7d57; --warn:#b4532a; --miss:#9b3b32;
  --muted:#9aa7b0; --surface:#173041; --border:rgba(243,237,227,.14);
  --display:"Fraunces","Iowan Old Style",Palatino,Georgia,serif;
  --sans:"Outfit","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--navy);color:var(--cream);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:disabled{opacity:.45;cursor:default}
img{display:block;max-width:100%}
h1,h2,h3{font-family:var(--display);letter-spacing:-.03em;line-height:1.15;margin:0;font-weight:500}
p{margin:0}
.page{max-width:56rem;margin:0 auto;padding:1.1rem 1rem 4rem}
.page.home{max-width:64rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:1rem}
.back,.help{display:inline-flex;align-items:center;gap:.4rem;min-height:44px;color:var(--muted);font-size:.9rem}
.back:hover,.help:hover{color:var(--cream)}
.kicker{font-size:.7rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--teal)}
.muted{color:var(--muted);font-size:.9rem;line-height:1.55}
.lead{font-size:1.05rem;line-height:1.55;color:rgba(243,237,227,.88)}
.display{font-style:italic;font-size:clamp(2.2rem,7vw,3.8rem)}
.hero{display:grid;gap:1.5rem;align-items:end;margin-bottom:1.6rem}
@media(min-width:900px){.hero{grid-template-columns:1.2fr .8fr}}
.hero-shot{overflow:hidden;border-radius:28px;border:1px solid var(--border);background:var(--gold)}
.hero-shot img{width:100%;aspect-ratio:16/9;object-fit:cover;object-position:center 35%}
.tiles{display:grid;gap:.75rem}
@media(min-width:720px){.tiles{grid-template-columns:1fr 1fr}}
.tile{display:flex;flex-direction:column;text-align:left;border-radius:24px;border:1px solid var(--border);background:var(--surface);padding:1.2rem 1.3rem;transition:transform .18s}
.tile:hover{transform:translateY(-2px)}
.tile.pulse{box-shadow:0 0 0 2px var(--teal)}
.tile.featured{background:var(--cream);color:var(--ink);border:none}
.tile.featured .kicker{color:var(--teal-deep)}
.tile h2{margin-top:.9rem;font-size:1.45rem}
.tile.featured h2{color:var(--ink)}
.tile p{margin-top:.45rem;flex:1;font-size:.9rem;line-height:1.5;color:var(--muted)}
.tile.featured p{color:rgba(26,42,54,.7)}
.cta{margin-top:1rem;display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 1rem;border-radius:999px;background:var(--cream);color:var(--navy);font-size:.85rem;font-weight:600}
.tile.featured .cta{background:var(--navy);color:var(--cream)}
.num{width:28px;height:28px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;background:rgba(42,155,143,.2);color:var(--teal);font-size:.8rem;font-weight:700}
.tile.featured .num{background:var(--navy);color:var(--cream)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:.7rem 1.15rem;border-radius:14px;font-weight:650;font-size:.95rem}
.btn.cream{background:var(--cream);color:var(--navy)}
.btn.teal{background:var(--teal);color:var(--navy)}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid var(--border)}
.btn.xl{width:100%;min-height:52px;border-radius:16px}
.navrow{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-top:1.25rem}
.dots{display:flex;gap:6px;margin:0 0 1.1rem}
.dots span{height:4px;flex:1;border-radius:99px;background:var(--surface)}
.dots span.on{background:var(--teal)}
.panel{border-radius:20px;background:var(--surface);padding:1rem 1.05rem;margin:.7rem 0}
.panel.cream{background:var(--cream);color:var(--ink)}
.panel h3{font-size:1.15rem;margin:.1rem 0 .35rem}
.flag{border-radius:16px;border:1px solid rgba(155,59,50,.35);background:rgba(155,59,50,.12);padding:.85rem 1rem;font-size:.9rem;line-height:1.5;margin:.7rem 0}
.good{border-radius:16px;border:1px solid rgba(47,125,87,.35);background:rgba(47,125,87,.12);padding:.85rem 1rem;font-size:.9rem;line-height:1.5;margin:.7rem 0}
.fit{background:var(--paper);color:var(--ink);border-radius:28px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.fit-head{display:flex;gap:1rem;padding:1.1rem 1.15rem}
.portrait{width:80px;height:80px;border-radius:20px;object-fit:cover;object-position:top;flex-shrink:0}
.fit h2{font-size:1.35rem}
.sub{color:rgba(26,42,54,.6);font-size:.9rem;margin-top:.15rem}
.hairline{height:1px;background:var(--rule);margin:0 1.15rem}
.signals{display:grid;gap:.75rem;padding:1.1rem 1.15rem}
@media(min-width:640px){.signals{grid-template-columns:1fr 1fr}}
.quote{margin:0 1.15rem 1.15rem;border-radius:16px;background:var(--cream);padding:.85rem 1rem;font-size:.9rem;line-height:1.5;color:rgba(26,42,54,.85)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.45rem}
.chip{border-radius:999px;border:1px solid var(--rule);background:var(--cream);color:rgba(26,42,54,.65);padding:.25rem .7rem;font-size:.75rem}
.chip.leftover{border-color:rgba(42,155,143,.75);background:rgba(42,155,143,.22);color:var(--teal-deep);font-weight:700;font-size:.95rem;padding:.45rem .95rem}
.pick{display:flex;align-items:center;gap:.8rem;width:100%;text-align:left;border-radius:20px;border:1px solid var(--border);background:var(--surface);padding:.8rem .9rem;color:var(--cream);margin:.4rem 0}
.pick.on{border-color:var(--teal);background:rgba(42,155,143,.15)}
.pick.trap.on{border-color:var(--miss);background:rgba(155,59,50,.16)}
.pick img{width:80px;height:56px;border-radius:12px;background:var(--paper);object-fit:contain}
.pick strong{display:block;font-weight:600}
.pick em{display:block;margin-top:2px;font-style:normal;font-size:.75rem;color:var(--muted)}
.sku-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:.75rem 0}
@media(min-width:640px){.sku-grid{grid-template-columns:1fr 1fr 1fr}}
.sku-pick{border:1px solid var(--border);background:var(--surface);border-radius:20px;padding:.7rem;text-align:center}
.sku-pick.on{border-color:var(--teal);background:rgba(42,155,143,.15)}
.sku-pick.dim{opacity:.38}
.sku-pick img{height:4.1rem;margin:0 auto .35rem;object-fit:contain;background:var(--paper);border-radius:12px;width:100%}
.sku-pick span{font-size:.82rem;font-weight:500}
.why{font-size:.78rem;color:var(--muted);margin-top:.35rem;min-height:1.1em}
.coach{border-left:2px solid var(--teal);padding:.15rem 0 .15rem .85rem;color:rgba(243,237,227,.88);font-size:.9rem;line-height:1.5;margin:.8rem 0}
.credit{margin-top:1.4rem;font-size:.72rem;color:rgba(243,237,227,.45);line-height:1.45}
.overlay{position:fixed;inset:0;background:rgba(8,14,20,.82);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:1rem}
.sheet{background:var(--navy);border:1px solid var(--border);border-radius:24px 24px 16px 16px;padding:1.2rem 1.2rem 1.4rem;max-width:36rem;width:100%;max-height:90vh;overflow:auto}
.sheet h2{margin:.3rem 0 .5rem}
.fam5{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
@media(min-width:720px){.fam5{grid-template-columns:repeat(5,1fr)}}
.thumb{overflow:hidden;border-radius:16px;background:var(--cream);color:var(--ink)}
.thumb img{height:72px;width:100%;object-fit:contain;background:var(--paper)}
.thumb p{padding:.45rem .35rem;text-align:center;font-size:11px;font-weight:600;line-height:1.2}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin:1rem 0}
@media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border-radius:16px;padding:.8rem}
.stat b{display:block;font-size:1.35rem;font-family:var(--display)}
.stat span{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lookup-grid{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0 1rem}
.lookup-grid button{border:1px solid var(--border);border-radius:999px;padding:.45rem .8rem;font-size:.85rem}
.lookup-grid button.on{background:var(--teal);color:var(--navy);border-color:var(--teal)}
.chart{width:100%;border-radius:16px;background:var(--paper);margin:.6rem 0}
.hint{font-size:.8rem;color:var(--muted);margin-top:.25rem}
.skip-link{background:none;border:none;color:var(--muted);font-size:.85rem;min-height:44px;text-decoration:underline;text-underline-offset:3px}
.sku-pick span{display:block}
.sku-pick .job{display:block;margin-top:.2rem;font-size:.68rem;line-height:1.3;color:var(--muted);font-weight:400}
.miss-list{margin:1rem 0 0;padding:0;list-style:none}
.miss-list li{border-top:1px solid var(--border);padding:.65rem 0;font-size:.9rem;line-height:1.45}
.miss-list b{display:block;margin-bottom:.15rem}
.live-flag{margin-top:.75rem}
.floor-strip{display:flex;flex-wrap:wrap;gap:.4rem;margin:1rem 0 .4rem}
.floor-strip span{border-radius:999px;background:var(--cream);color:var(--ink);padding:.3rem .7rem;font-size:.72rem;font-weight:600}
.floor-strip span em{font-style:normal;color:var(--teal-deep);margin-right:.25rem}
.copy-row{display:flex;gap:.5rem;margin-top:.8rem;flex-wrap:wrap}
.sku-pick.blank{border-color:rgba(155,59,50,.45)}
.quiet{margin-top:1rem;font-size:.85rem;color:var(--muted)}
.quiet button{color:var(--cream);text-decoration:underline;text-underline-offset:3px;min-height:44px}
.quiet a{color:var(--cream);text-decoration:underline;text-underline-offset:3px}
.replay-btn{display:block;width:100%;text-align:left;margin-top:.35rem;color:var(--teal);font-size:.82rem;font-weight:600}
</style>
<script src="/games/the-4th-engine.js"></script>
</head>
<body>
<div id="app"></div>
</body>
</html>
