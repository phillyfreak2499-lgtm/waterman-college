<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>The 4th — Waterman College</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

<style>
:root{
  --navy:#0f1c28; --ink:#1a2a36; --teal:#2a9b8f; --teal-deep:#1e746b;
  --cream:#f3ede3; --gold:#e8b423; --paper:#f7f3ec; --rule:#d9d0c4;
  --good:#2f7d57; --warn:#b4532a; --miss:#9b3b32;
  --muted:#9aa7b0; --surface:#173041; --border:rgba(243,237,227,.14);
  --display:"Fraunces","Iowan Old Style",Palatino,Georgia,serif;
  --sans:"Outfit","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--navy);color:var(--cream);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:disabled{opacity:.45;cursor:default}
img{display:block;max-width:100%}
h1,h2,h3{font-family:var(--display);letter-spacing:-.03em;line-height:1.15;margin:0;font-weight:500;text-wrap:balance}
p{margin:0;text-wrap:pretty}
.page{max-width:56rem;margin:0 auto;padding:1.1rem 1rem 3.5rem}
.page.home{max-width:64rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:1rem}
.back,.skip{display:inline-flex;align-items:center;gap:.4rem;min-height:44px;color:var(--muted);font-size:.9rem}
.back svg,.skip svg,.ico svg,.sig svg,.quote svg,.pick svg,.exam-log svg,.panel svg{width:16px;height:16px}
.back:hover,.skip:hover{color:var(--cream)}
.kicker{font-size:.7rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--teal)}
.kicker.campus{margin-bottom:.75rem}
.teal{color:var(--teal)} .teal-deep{color:var(--teal-deep)!important}
.mini{font-size:.7rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:rgba(26,42,54,.45)}
.muted{color:var(--muted);font-size:.9rem;line-height:1.55}
.lead{font-size:1.05rem;line-height:1.55;color:rgba(243,237,227,.88)}
.lead.tight{font-size:1rem}
.cream-text{color:var(--cream)}
.strong{font-weight:600}
.italic{font-family:var(--display);font-style:italic;color:rgba(243,237,227,.72);margin-top:.5rem;line-height:1.45}
.display{font-style:italic;font-size:clamp(2.4rem,8vw,4.2rem)}
.hero{display:grid;gap:1.75rem;align-items:end;margin-bottom:2rem}
@media(min-width:900px){.hero{grid-template-columns:1.15fr .85fr}}
.hero .lede{font-size:1.15rem;color:rgba(243,237,227,.82);margin-top:.65rem}
.hero .muted{margin-top:1rem;max-width:32rem}
.ruleline{margin-top:1.15rem;max-width:32rem;border-left:2px solid rgba(42,155,143,.7);padding-left:1rem;color:rgba(243,237,227,.88);font-size:.9rem;line-height:1.55}
.hero-shot{overflow:hidden;border-radius:28px;border:1px solid var(--border);background:var(--gold)}
.hero-shot img,.gold-frame img{width:100%;aspect-ratio:16/9;object-fit:cover;object-position:center 35%}
.gold-frame{overflow:hidden;border-radius:28px;border:1px solid var(--border);background:var(--gold);margin-bottom:1.25rem}
.gold-frame img{aspect-ratio:auto;object-fit:contain}
.modes{display:grid;gap:.75rem}
@media(min-width:640px){.modes{grid-template-columns:1fr 1fr}}
.mode{display:flex;flex-direction:column;text-align:left;border-radius:28px;border:1px solid var(--border);background:var(--surface);padding:1.25rem 1.35rem;transition:transform .2s}
.mode:hover{transform:translateY(-2px)}
.mode.featured{background:var(--cream);color:var(--ink);border:none;grid-column:1/-1}
.mode-top{display:flex;align-items:center;justify-content:space-between;gap:.75rem}
.ico{display:flex;width:40px;height:40px;align-items:center;justify-content:center;border-radius:14px;background:rgba(15,28,40,.4);color:var(--teal)}
.mode.featured .ico{background:var(--navy);color:var(--cream)}
.mode.featured .kicker{color:var(--teal-deep)}
.mode h2{margin-top:1.15rem;font-size:1.55rem}
.mode.featured h2{color:var(--ink)}
.mode p{margin-top:.5rem;flex:1;font-size:.9rem;line-height:1.5;color:var(--muted)}
.mode.featured p{color:rgba(26,42,54,.7)}
.cta{margin-top:1.15rem;display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 1rem;border-radius:999px;background:var(--cream);color:var(--navy);font-size:.85rem;font-weight:600}
.mode.featured .cta{background:var(--navy);color:var(--cream)}
.dots{display:flex;gap:6px;margin:0 0 1.1rem}
.dots span{height:4px;flex:1;border-radius:99px;background:var(--surface)}
.dots span.on{background:var(--teal)}
.stack{display:flex;flex-direction:column;gap:.7rem;margin-top:.4rem}
.beats{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:.7rem}
.beats li{display:flex;gap:.75rem;border-radius:20px;background:var(--surface);padding:.85rem 1rem}
.beats span{font-family:var(--display);font-style:italic;font-size:1.25rem;color:var(--teal)}
.panel{border-radius:20px;background:var(--surface);padding:1rem 1.05rem}
.panel.border{border:1px solid var(--border);background:transparent}
.panel.cream-ink{background:var(--cream);color:var(--ink)}
.panel.tight{padding:0;overflow:hidden}
.panel h3{font-size:1.2rem;margin:.15rem 0 .25rem}
.thumb{overflow:hidden;border-radius:16px;background:var(--cream);color:var(--ink)}
.thumb img{height:64px;width:100%;object-fit:contain;background:var(--paper)}
.thumb p{padding:.5rem .4rem;text-align:center;font-size:11px;font-weight:600;line-height:1.2}
.fam3{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.fam5{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem}
@media(min-width:640px){.fam5{grid-template-columns:repeat(5,1fr)}}
.fam3 .thumb img{height:96px}
.shot{overflow:hidden;border-radius:20px}
.shot.paper,.paper{background:var(--paper)}
.shot img{width:100%;object-fit:cover}
.flag{border-radius:16px;border:1px solid rgba(155,59,50,.3);background:rgba(155,59,50,.1);padding:.85rem 1rem;font-size:.9rem;line-height:1.5;color:rgba(243,237,227,.9)}
.navrow{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-top:1.25rem}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:.7rem 1.15rem;border-radius:14px;font-weight:650;font-size:.95rem}
.btn.cream{background:var(--cream);color:var(--navy)}
.btn.teal{background:var(--teal);color:var(--navy)}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid var(--border)}
.btn.xl{width:100%;min-height:52px;border-radius:16px;margin-top:.4rem}
.btn.grow{flex:2}
.row-between{display:flex;align-items:baseline;justify-content:space-between;gap:.75rem}
.age{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.fit{background:var(--paper);color:var(--ink);border-radius:28px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.fit-head{display:flex;gap:1rem;padding:1.1rem 1.15rem}
.portrait{width:80px;height:80px;border-radius:20px;object-fit:cover;object-position:top;flex-shrink:0}
.fit h2{font-size:1.35rem}
.sub{color:rgba(26,42,54,.6);font-size:.9rem;margin-top:.15rem}
.hairline{height:1px;background:var(--rule);margin:0 1.15rem}
.signals{display:grid;gap:.75rem;padding:1.1rem 1.15rem}
@media(min-width:640px){.signals,.card-grid{grid-template-columns:1fr 1fr}}
.sig{display:flex;gap:.65rem}
.sig svg{margin-top:4px;color:var(--teal-deep);width:14px;height:14px}
.quote{margin:0 1.15rem 1.15rem;border-radius:16px;background:var(--cream);padding:.85rem 1rem;display:flex;gap:.5rem;font-size:.9rem;line-height:1.5;color:rgba(26,42,54,.85)}
.quote svg{flex-shrink:0;margin-top:2px;color:var(--teal)}
.card-grid{display:grid;gap:1rem;padding:1.1rem 1.15rem}
.plain{list-style:none;padding:0;margin:.45rem 0 0;font-size:.9rem;line-height:1.45;color:rgba(26,42,54,.8)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.45rem}
.chip{border-radius:999px;border:1px solid var(--rule);background:var(--cream);color:rgba(26,42,54,.65);padding:.25rem .7rem;font-size:.75rem}
.chip.leftover{border-color:rgba(42,155,143,.5);background:rgba(42,155,143,.15);color:var(--teal-deep);font-weight:600}
.chip.ghost{border-color:var(--border);background:transparent;color:rgba(243,237,227,.8)}
.leftover-line{margin-top:.3rem;font-weight:600}
.pick,.mention,.line-pick{display:flex;align-items:center;gap:.8rem;width:100%;text-align:left;border-radius:20px;border:1px solid var(--border);background:var(--surface);padding:.8rem .9rem;color:var(--cream)}
.pick.on,.mention.on{border-color:var(--teal);background:rgba(42,155,143,.15)}
.pick img{width:80px;height:56px;border-radius:12px;background:var(--paper);object-fit:contain}
.pick strong{display:block;font-weight:600}
.pick em{display:block;margin-top:2px;font-style:normal;font-size:.75rem;color:var(--muted)}
.pick svg{margin-left:auto;color:var(--teal)}
.mention{flex-direction:column;align-items:flex-start;padding:1rem}
.mention .body{margin-top:.5rem;font-size:.9rem;line-height:1.5;color:rgba(243,237,227,.9)}
.locked{border-radius:16px;background:var(--surface);padding:.6rem 1rem;font-size:.9rem;color:rgba(243,237,227,.8)}
.grade-grid{display:grid;gap:.7rem}
@media(min-width:640px){.grade-grid{grid-template-columns:1fr 1fr}}
.mini.gold{color:var(--good)} .mini.okay{color:var(--warn)} .mini.miss,.miss{color:var(--miss)}
.paper-box{border-radius:20px;background:var(--cream);color:var(--ink);padding:1rem 1.05rem}
.paper-box .italic,.contrast.gold .italic{color:rgba(26,42,54,.85)}
.place-rows{margin-top:.9rem;display:flex;flex-direction:column;gap:.5rem}
.place-row{border-radius:12px;background:var(--paper);padding:.55rem .75rem}
.place-row p+p{margin-top:.15rem;font-size:.9rem;color:rgba(26,42,54,.8)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
@media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{font-family:var(--display);font-size:1.7rem;margin-top:.2rem}
.exam-log{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:.5rem}
.exam-log li{display:flex;align-items:center;gap:.75rem;border-radius:18px;background:var(--surface);padding:.7rem .8rem}
.exam-log img{width:48px;height:48px;border-radius:12px;object-fit:cover;object-position:top}
.exam-log .name{font-weight:600;font-size:.9rem}
.exam-log .pts{font-variant-numeric:tabular-nums;margin-left:auto}
.exam-log svg{color:var(--good)}
.tight{margin-top:.15rem;font-size:.75rem}
.letter-head{display:flex;align-items:flex-end;gap:1rem}
.giant{font-family:var(--display);font-style:italic;font-size:3rem;line-height:1;color:var(--teal)}
.reveal{width:100%;text-align:left;border-radius:20px;border:1px dashed var(--border);background:rgba(23,48,65,.6);padding:1rem}
.reveal.open{border-style:solid;background:var(--cream);color:var(--ink)}
.reveal .italic{color:inherit}
.ink-soft{margin-top:.45rem;font-size:.9rem;color:rgba(26,42,54,.7)}
.contrast{border-radius:20px;padding:1rem 1.05rem}
.contrast.gold{background:var(--cream);color:var(--ink)}
.contrast.okay{border:1px solid rgba(180,83,42,.4);background:var(--surface)}
.contrast.miss{border:1px solid rgba(155,59,50,.3);background:rgba(155,59,50,.1)}
.contrast .soft{margin-top:.7rem;font-size:.9rem;line-height:1.5;opacity:.8}
.right{text-align:right}
.seats{list-style:none;padding:0;margin:.4rem 0;display:flex;flex-direction:column;gap:.5rem}
.seats li{min-height:64px;border-radius:16px;padding:.75rem 1rem;border:1px dashed var(--border);background:rgba(23,48,65,.6)}
.seats li.right{border-style:solid;border-color:rgba(47,125,87,.4);background:rgba(47,125,87,.1)}
.seats li.wrong{border-style:solid;border-color:rgba(155,59,50,.4);background:rgba(155,59,50,.1)}
.line-pick.used{opacity:.4}
.chip-btn{min-height:40px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--muted);padding:0 .9rem;font-size:.875rem}
.chip-btn.on{border-color:var(--teal);background:rgba(42,155,143,.2);color:var(--cream)}
.chip-btn.cream{border-color:var(--cream);background:var(--cream);color:var(--ink)}
.pill{min-height:40px;border-radius:999px;border:1px solid var(--border);padding:0 1rem;color:var(--muted);font-size:.875rem}
.chart-wrap{overflow:auto;border-radius:20px;background:var(--paper);max-height:16rem}
.chart-wrap.open{max-height:80vh}
.chart-wrap img{min-width:720px;width:100%;max-width:none}
.fam-cols{display:grid;gap:1rem;margin-top:1rem}
@media(min-width:640px){.fam-cols{grid-template-columns:repeat(3,1fr)}}
.sku-list{list-style:none;padding:0;margin:.7rem 0 0}
.sku-list button{color:var(--cream);font-size:.9rem;text-align:left;min-height:32px}
.sku-list button:hover{color:var(--teal)}
.sku-grid{display:grid;gap:.75rem;margin-top:1rem}
@media(min-width:640px){.sku-grid{grid-template-columns:1fr 1fr}}
@media(min-width:1024px){.sku-grid{grid-template-columns:1fr 1fr 1fr}}
.sku-card{overflow:hidden;border-radius:20px;border:1px solid var(--border);background:var(--surface);text-align:left;color:inherit}
.sku-card.on{border-color:var(--teal);background:rgba(42,155,143,.1)}
.sku-card img{height:144px;width:100%;object-fit:contain}
.rel{position:relative}
.badge{position:absolute;top:8px;right:8px;border-radius:999px;padding:2px 8px;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.badge.ok{background:var(--good);color:var(--cream)}
.badge.no{background:rgba(15,28,40,.8);color:rgba(243,237,227,.8)}
.pad{padding:.8rem .9rem}
.name{font-weight:600;margin-top:2px}
.fam-hero{display:grid;gap:1.1rem;overflow:hidden;border-radius:28px;background:var(--cream);color:var(--ink);margin-top:1rem}
@media(min-width:640px){.fam-hero{grid-template-columns:.9fr 1.1fr}}
.fam-hero img{height:14rem;width:100%;object-fit:contain;background:var(--paper)}
.fam-hero>div{padding:1.1rem 1.2rem}
.fam-hero ul{margin:.9rem 0 0;padding:0;list-style:none}
.fam-hero li{border-left:2px solid rgba(42,155,143,.5);padding-left:.75rem;margin-top:.45rem;font-size:.9rem;line-height:1.45}
.sku-detail{display:grid;gap:1.1rem;border-radius:28px;border:1px solid rgba(42,155,143,.4);background:var(--surface);padding:1rem;margin:1.25rem 0}
@media(min-width:640px){.sku-detail{grid-template-columns:.9fr 1.1fr;padding:1.4rem}}
.sku-detail img{width:100%;object-fit:contain}
.sku-detail h3{font-size:1.85rem;margin:.2rem 0 .4rem}
.sku-detail ul{margin:.9rem 0 0;padding:0;list-style:none}
.sku-detail li{border-left:2px solid rgba(42,155,143,.5);padding-left:.75rem;margin-top:.45rem;font-size:.9rem}
.mark-pill{margin-top:.7rem;border-radius:12px;padding:.55rem .75rem;font-size:.9rem}
.mark-pill.ok{background:rgba(47,125,87,.15)}
.mark-pill.no{background:rgba(155,59,50,.15)}
.warn{margin-top:.7rem;color:var(--warn);font-size:.9rem}
.feat-grid{display:grid;gap:.75rem}
@media(min-width:640px){.feat-grid{grid-template-columns:1fr 1fr}}
.feat-grid img{height:176px;width:100%;object-fit:contain;background:var(--paper)}
.disclaimer{text-align:center;color:var(--muted);font-size:.75rem;line-height:1.5;margin-top:1.5rem}
h1{font-size:clamp(1.7rem,4vw,2.2rem);margin:.15rem 0 .7rem}
h2{font-size:1.45rem;margin:1.1rem 0 .5rem}
section{margin-top:1.6rem}
@media (prefers-reduced-motion:reduce){
  .mode,.btn,.pick,.mention{transition:none!important}
}

</style>
</head>

  function currentScenario(kind) {
    if (kind === "exam") return scenarioById(state.examOrder[state.examIndex]);

  function lockSupport() {
    if (!state.supportPick) return;
    if (state.view === "exam") state.examStep = "mention";
    else state.floorStep = "mention";
    render();
  }
  function lockMention() {
    if (!state.supportPick || !state.mentionPick) return;
    if (state.view === "exam") {
      var result = buildResult(state.examOrder[state.examIndex], state.supportPick, state.mentionPick);
      state.examLog.push(result);
      var last = state.examIndex >= state.examOrder.length - 1;
      if (last) {
        var total = state.examLog.reduce(function (a, r) { return a + r.supportPts + r.mentionPts; }, 0);
        var max = state.examOrder.length * D.ROUND_MAX;
        var pct = Math.round((total / max) * 100);
        state.examActive = false;
        state.examStep = "debrief";
        state.lastExamScore = pct;
        state.bestExam = Math.max(state.bestExam, pct);
        state.supportPick = null;
        state.mentionPick = null;
        writeSaved();
      } else {
        state.examIndex += 1;
        state.examStep = "brief";
        state.supportPick = null;
        state.mentionPick = null;
      }
      render();
      return;
    }
    state.floorLog.push(buildResult(state.floorOrder[state.floorIndex], state.supportPick, state.mentionPick));
    state.floorStep = "debrief";
    render();
  }
  function nextFloor() {
    var last = state.floorIndex >= state.floorOrder.length - 1;
    if (last) {
      var total = state.floorLog.reduce(function (a, r) { return a + r.supportPts + r.mentionPts; }, 0);
      var max = state.floorLog.length * D.ROUND_MAX;
      var pct = max ? Math.round((total / max) * 100) : 0;
      state.bestFloor = Math.max(state.bestFloor, pct);
      state.view = "home";
      state.floorStep = "brief";
      state.supportPick = null;
      state.mentionPick = null;
      writeSaved();
      render();
      return;
    }
    state.floorIndex += 1;
    state.floorStep = "brief";
    state.supportPick = null;
    state.mentionPick = null;
    render();
  }
  function submitPlace() {
    var scenario = currentScenario("place");
    var correctOrder = scenario.place.map(function (p) { return p.key; });
    var correct = 0;
    state.placeBuilt.forEach(function (k, i) {
      if (k === correctOrder[i]) correct += 1;
    });
    state.placeSubmitted = true;
    state.placeLog.push({ scenarioId: scenario.id, correct: correct, total: 5 });
    render();
  }
  function nextPlace() {
    var last = state.placeIndex >= state.placeOrder.length - 1;
    if (last) {
      var total = state.placeLog.reduce(function (a, r) { return a + r.correct; }, 0);
      var max = state.placeLog.length * 5;
      var pct = max ? Math.round((total / max) * 100) : 0;
      state.bestPlace = Math.max(state.bestPlace, pct);
      state.view = "home";
      state.placeBuilt = [];
      state.placeSubmitted = false;
      writeSaved();
      render();
      return;
    }
    state.placeIndex += 1;
    state.placeBuilt = [];
    state.placeSubmitted = false;
    render();
  }

  function viewRound(exam) {
    var order = exam ? state.examOrder : state.floorOrder;
    var index = exam ? state.examIndex : state.floorIndex;
    var step = exam ? state.examStep : state.floorStep;
    var s = currentScenario(exam ? "exam" : "floor");
    var title =
      step === "brief"
        ? "Read the card"
        : step === "support"
          ? "Which 4th?"
          : step === "mention"
            ? "How do you mention it?"
            : exam
              ? "Eval closed"
              : "Debrief";
    var body = customerCard(s, step === "mention");
    if (step === "brief") {
      body += btn("Choose the 4th", "begin", "cream xl");
    } else if (step === "support") {
      var supports = D.shuffleCopy(D.SUPPORT_ORDER, s.id + "-support");
      body +=
        '<p class="muted">The 4th lives in the leftover shoe. Age only breaks the tie.</p><div class="stack">' +
        supports
          .map(function (id) {
            var t = D.SUPPORTS[id];
            var on = state.supportPick === id;
            return (
              '<button type="button" class="pick' +
              (on ? " on" : "") +
              '" data-act="support" data-id="' +
              id +
              '"><img src="' +
              asset(t.image) +
              '" alt=""><span><strong>' +
              esc(t.name) +
              "</strong><em>" +
              esc(t.livesIn) +
              "</em></span>" +
              (on ? icon("check") : "") +
              "</button>"

          })
          .join("") +
        "</div>" +
        '<button type="button" class="btn cream xl" data-act="lock-support"' +
        (state.supportPick ? "" : " disabled") +

    } else if (step === "mention") {
      var mentions = D.shuffleCopy(s.mentions, s.id + "-mention");
      body +=
        (state.supportPick
          ? '<p class="locked">Locked 4th · ' + esc(D.SUPPORTS[state.supportPick].name) + "</p>"
          : "") +
        '<p class="muted">' +
        (exam
          ? "Gold uses their words. A miss sounds like a register."
          : "Gold uses PLACE: their words, leftover shoe, named 4th, their outcome. A miss sounds like a register.") +
        '</p><div class="stack">' +

          .map(function (m) {

  function gradeCard(label, tone, title, body, note) {
    var tag = tone === "gold" ? "Gold" : tone === "okay" ? "Okay" : "Miss";
    return (
      '<div class="panel"><div class="row-between"><p class="mini">' +
      esc(label) +

      tone +
      '">' +
      tag +
      "</p></div>" +
      (note ? '<p class="kicker">' + esc(note) + "</p>" : "") +
      '<p class="cream-text strong">' +
      esc(title) +
      '</p><p class="muted">' +
      esc(body) +
      "</p></div>"
    );

  function debrief(scenario, result, last) {
    var picked = D.SUPPORTS[result.supportPick];
    var gold = D.SUPPORTS[scenario.correct];
    var supportTone = result.supportPts === 10 ? "gold" : result.supportPts === 5 ? "okay" : "miss";
    var supportTitle =
      supportTone === "gold"
        ? gold.name
        : supportTone === "okay"
          ? picked.name + " — acceptable"
          : "You picked " + picked.name;
    var supportBody =
      supportTone === "gold"
        ? scenario.why
        : supportTone === "okay"
          ? "Soft yes. Textbook 4th is " + gold.name + ". " + scenario.why
          : "Textbook 4th is " + gold.name + ". " + (result.supportPick === scenario.trap ? scenario.trapWhy : scenario.why);
    var mentionTitle =
      result.mentionQuality === "gold"
        ? "PLACE — you used their words"
        : result.mentionQuality === "okay"
          ? "Features, not their interview"
          : "That was a register";
    var mentionBody =
      result.mentionQuality === "gold"
        ? scenario.coach
        : result.mentionQuality === "okay"
          ? "You got the pair in the right shoe, but you didn't playback the quote. Gold repeats the leftover life, then eases."
          : "That sounded like a register. Gold uses their words, names the leftover shoe, and eases. Don't price it, don't 4-pack it, don't skip the leftover.";
    var goldText = scenario.mentions.find(function (m) { return m.quality === "gold"; }).text;
    var pickedMention = scenario.mentions.find(function (m) { return m.id === result.mentionPick; });
    return (
      '<div class="grade-grid">' +
      gradeCard("The 4th", supportTone, supportTitle, supportBody) +
      gradeCard("The mention", result.mentionQuality, mentionTitle, mentionBody, pickedMention && pickedMention.label) +
      '</div><div class="paper-box"><p class="mini teal-deep">Age · Job · Play</p><ul class="plain ink">' +
      "<li>" + esc(scenario.ageRead) + "</li><li>" + esc(scenario.jobRead) + "</li><li>" + esc(scenario.playRead) + "</li></ul></div>" +
      '<div class="paper-box"><p class="mini teal-deep">What gold sounds like</p><p class="italic ink">' +
      esc(goldText) +
      "</p><div class=\"place-rows\">" +
      scenario.place
        .map(function (p) {
          return (
            '<div class="place-row"><p class="mini teal-deep">' +
            esc(p.key + " · " + p.title) +
            "</p><p>" +
            esc(p.text) +
            "</p></div>"
          );
        })
        .join("") +
      "</div></div>" +
      btn(last ? "Finish the floor" : "Next customer", "next-floor", "cream xl")
    );
  }

    var fourthHits = log.filter(function (r) { return r.supportPts === 10; }).length;

      '<p class="kicker">Presentation eval</p>' +

    var finished = state.placeIndex + 1 >= state.placeOrder.length && state.placeSubmitted;
    var seats =
      "<ol class=\"seats\">" +
      SEATS.map(function (seat, i) {
        var key = state.placeBuilt[i];
        var line = s.place.find(function (p) { return p.key === key; });
        var expected = s.place[i] && s.place[i].key;
        var right = state.placeSubmitted && key === expected;
        var wrong = state.placeSubmitted && key && key !== expected;
        return (
          "<li class=\"" +
          (wrong ? "wrong" : right ? "right" : "empty") +
          "\"><p class=\"kicker\">" +

              '" data-act="tap-place" data-id="' +

        (lastLog.correct < 5
          ? "<ul class=\"stack\">" +

              .map(function (p, i) {

                  '<li class="flag">Seat ' +

  var lastScrollKey = "";
  function render() {
    var app = document.getElementById("app");
    var html = "";
    if (state.view === "home") html = viewHome();
    else if (state.view === "framework") html = viewFramework();
    else if (state.view === "catalog") html = viewCatalog();
    else if (state.view === "floor") html = viewRound(false);
    else if (state.view === "place-lesson") html = viewPlaceLesson();
    else if (state.view === "place") html = viewPlace();
    else if (state.view === "exam") {
      html = !state.examActive && state.examLog.length ? viewExamReport() : viewRound(true);
    }
    app.innerHTML = html;
    var key =
      state.view +
      "|" +
      state.frameworkPage +
      "|" +
      state.placeLessonPage +
      "|" +
      state.floorIndex +
      "|" +
      state.placeIndex +
      "|" +
      state.examIndex +
      "|" +
      state.floorStep +
      "|" +
      state.examStep +
      "|" +
      state.placeSubmitted;
    if (key !== lastScrollKey) {
      lastScrollKey = key;
      window.scrollTo(0, 0);
    }
  }

  document.getElementById("app").addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]");
    if (!t) return;
    var act = t.getAttribute("data-act");
    var id = t.getAttribute("data-id");
    if (t.disabled) return;
    if (act === "home") goHome();
    else if (act === "framework") startFramework();
    else if (act === "catalog") startCatalog();
    else if (act === "floor") startFloor();
    else if (act === "place-lesson") startPlaceLesson();
    else if (act === "place") startPlace();
    else if (act === "exam") startExam();
    else if (act === "fw-next") {
      state.frameworkPage = Math.min(FW_TITLES.length - 1, state.frameworkPage + 1);
      render();
    } else if (act === "fw-prev") {
      state.frameworkPage = Math.max(0, state.frameworkPage - 1);
      render();
    } else if (act === "fw-done") {
      state.frameworkDone = true;
      writeSaved();
      startFloor();
    } else if (act === "fw-chart") {
      state.view = "framework";
      state.frameworkPage = 4;
      render();
    } else if (act === "pl-next") {
      state.placeLessonPage = Math.min(D.PLACE_LESSON_TITLES.length - 1, state.placeLessonPage + 1);
      render();
    } else if (act === "pl-prev") {
      state.placeLessonPage = Math.max(0, state.placeLessonPage - 1);
      render();
    } else if (act === "pl-done") {
      state.placeLessonDone = true;
      writeSaved();
      startPlace();
    } else if (act === "maria") {
      var i = Number(t.getAttribute("data-i"));
      state.mariaOpen = Math.max(state.mariaOpen, i + 1);
      render();
    } else if (act === "begin") {
      if (state.view === "exam") state.examStep = "support";
      else state.floorStep = "support";
      render();
    } else if (act === "support") {
      state.supportPick = id;
      render();
    } else if (act === "lock-support") lockSupport();
    else if (act === "mention") {
      state.mentionPick = id;
      render();
    } else if (act === "lock-mention") lockMention();
    else if (act === "next-floor") nextFloor();
    else if (act === "tap-place") {
      if (state.placeSubmitted || state.placeBuilt.indexOf(id) >= 0) return;
      state.placeBuilt.push(id);
      render();
    } else if (act === "undo-place") {
      if (state.placeSubmitted) return;
      state.placeBuilt = state.placeBuilt.slice(0, -1);
      render();
    } else if (act === "submit-place") submitPlace();
    else if (act === "next-place") nextPlace();
    else if (act === "fam") {
      state.catFamily = id;
      state.catOpen = preferredSku(state.catActivity, id, state.catOpen);
      render();
    } else if (act === "act") {
      state.catActivity = id;
      state.catOpen = preferredSku(id, state.catFamily, state.catOpen);
      render();
    } else if (act === "unmarked") {
      state.catShowUnmarked = !state.catShowUnmarked;
      if (!state.catShowUnmarked) {
        state.catOpen = preferredSku(state.catActivity, state.catFamily, state.catOpen);
      }
      render();
    } else if (act === "sku") {
      state.catOpen = id;
      state.catFamily = D.SKUS[id].family;
      render();
    } else if (act === "chart-toggle") {
      state.chartOpen = !state.chartOpen;
      render();
    }
  });

  render();
})();

</script>
</body>
</html>
