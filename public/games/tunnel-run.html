<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#07182b"/>
<title>Tunnel Run — Waterman College</title>
<script src="/games/quad-bridge.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#07182b;color:#f7f4ec;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none;user-select:none;-webkit-tap-highlight-color:transparent}
input,textarea{user-select:text;-webkit-user-select:text;touch-action:manipulation}
#wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#stage{position:relative;line-height:0}
canvas{display:block;border-radius:14px;box-shadow:0 0 0 1px rgba(201,162,39,.30),0 24px 60px rgba(0,0,0,.55)}

/* ---------- HUD ---------- */
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
  gap:8px;padding:12px 14px;pointer-events:none;line-height:1.2}
.grp{display:flex;gap:8px;align-items:center}
.chip{display:flex;align-items:center;gap:6px;background:rgba(7,24,43,.72);border:1px solid rgba(201,162,39,.34);
  border-radius:999px;padding:6px 12px;font-size:13px;font-weight:750;letter-spacing:.01em;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);text-shadow:0 1px 2px rgba(0,0,0,.6)}
.chip .k{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#8fa8bd}
#hearts{display:flex;gap:5px;align-items:center}
.hp{width:15px;height:14px;position:relative;transition:transform .18s ease,opacity .18s ease}
.hp svg{width:100%;height:100%;display:block}
.hp.off{opacity:.22;transform:scale(.82)}
.hp.pulse{animation:hb .5s ease}
@keyframes hb{0%{transform:scale(1)}30%{transform:scale(1.5)}100%{transform:scale(1)}}
#pips{display:flex;gap:4px}
.pip{width:16px;height:4px;border-radius:2px;background:rgba(247,244,236,.22)}
.pip.on{background:#C9A227;box-shadow:0 0 8px rgba(201,162,39,.7)}
.pip.now{background:#f7f4ec}
#comboChip{color:#e7c964;border-color:rgba(201,162,39,.7)}
#comboChip.wow{box-shadow:0 0 14px rgba(201,162,39,.55)}
#powChip{color:#d6e7f4}

/* ---------- overlay cards ---------- */
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 50% 40%,rgba(9,30,54,.80),rgba(4,12,22,.95));padding:18px;
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#ov.hid{display:none}
.card{background:linear-gradient(180deg,#fbf9f3,#f2ede1);color:#0f1c24;border-radius:18px;padding:24px 22px;line-height:1.45;
  max-width:460px;width:100%;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.5);
  animation:pop .22s cubic-bezier(.2,1.3,.4,1);max-height:100%;overflow:auto}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.card h1{font-family:Georgia,"Times New Roman",serif;font-size:34px;line-height:1.15;color:#0B2A4A;margin:4px 0 2px;letter-spacing:-.01em}
.card h2{font-family:Georgia,"Times New Roman",serif;font-size:24px;line-height:1.2;color:#0B2A4A;margin:4px 0}
.tag{font-size:10px;line-height:1.6;font-weight:850;letter-spacing:.16em;text-transform:uppercase;color:#a8861a}
.card p{font-size:14.5px;color:#54646f;margin:9px 0;line-height:1.45}
.card p.lead{color:#22333f;font-size:15px}
.rule{height:1px;background:linear-gradient(90deg,transparent,#d9d1bd,transparent);margin:14px 0}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0 2px}
.stat{background:#fff;border:1px solid #e2dbca;border-radius:11px;padding:8px 13px;min-width:78px}
.stat b{display:block;font-size:19px;line-height:1.25;color:#0B2A4A;font-family:Georgia,serif}
.stat span{display:block;font-size:9.5px;line-height:1.5;letter-spacing:.11em;text-transform:uppercase;color:#8d9aa3;font-weight:800}
.btn{display:block;width:100%;min-height:50px;margin-top:10px;border:none;border-radius:13px;font-weight:800;
  font-size:15.5px;cursor:pointer;background:#0B2A4A;color:#fff;transition:transform .1s ease,filter .15s ease}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:translateY(1px)}
.btn.gold{background:linear-gradient(180deg,#dfb63a,#C9A227);color:#0B2A4A;box-shadow:0 4px 0 #9c7c19}
.btn.gold:active{box-shadow:0 2px 0 #9c7c19}
.btn:disabled{opacity:.45;cursor:default;filter:none;box-shadow:none}
.btn.ghost{background:transparent;color:#0B2A4A;border:1.5px solid #c9d2d9;min-height:44px;font-size:14px}
.btn.slim{min-height:36px;margin:0;width:auto;padding:0 12px;font-size:12.5px;border-radius:9px}
.hint{font-size:12px;color:#8a9ba6;margin-top:10px;line-height:1.4}
.card.shop{max-width:540px;text-align:left;padding:18px 16px}
.shop-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.shop-gold{background:#0B2A4A;color:#e7c964;border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;letter-spacing:.02em;white-space:nowrap}
.tabs{display:flex;gap:6px;margin:12px 0 10px;flex-wrap:wrap}
.tab{flex:1;min-width:78px;min-height:40px;border:1.5px solid #d7cfbc;background:#fff;border-radius:10px;font-weight:800;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#5d6b74;cursor:pointer}
.tab.on{background:#0B2A4A;color:#f7f4ec;border-color:#0B2A4A}
.shelf{display:grid;gap:8px;max-height:min(52vh,340px);overflow:auto;padding-right:2px}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:#fff;border:1px solid #e2dbca;border-radius:12px;padding:10px 12px}
.item.have{border-color:#C9A227;box-shadow:inset 0 0 0 1px rgba(201,162,39,.35)}
.item h3{font-size:14px;color:#0B2A4A;margin:0;line-height:1.2}
.item p{font-size:12px;color:#54646f;margin:2px 0 0;line-height:1.35}
.swatch{display:flex;gap:4px;margin-top:6px}
.swatch i{width:12px;height:12px;border-radius:3px;border:1px solid rgba(11,42,74,.18);display:block}
.toast{font-size:12px;color:#186241;margin:8px 0 0;min-height:16px}
.named{display:flex;gap:8px;align-items:center;margin:8px 0 4px}
.named input{flex:1;min-height:42px;border:1.5px solid #d7cfbc;border-radius:10px;padding:0 12px;font-weight:700;font-size:14px;color:#0B2A4A;background:#fff;font-family:inherit}
.named input:focus{outline:none;border-color:#C9A227}
.board{margin:10px 0 0;text-align:left;background:#fff;border:1px solid #e2dbca;border-radius:12px;padding:10px 12px}
.board b{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#8d9aa3;margin-bottom:6px}
.board li{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#22333f;list-style:none;padding:3px 0;border-top:1px solid #f0eadc}
.board li:first-of-type{border-top:none}
.board ul{margin:0;padding:0}
.board .n{font-weight:800;color:#0B2A4A;font-variant-numeric:tabular-nums}
.named label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#8d9aa3;font-weight:800;white-space:nowrap}
#rot{display:none;position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:12px;
  font-weight:700;letter-spacing:.04em;color:#9fb4c6;pointer-events:none}
@media (orientation:portrait) and (max-width:820px){#rot{display:block}}
.keys{display:inline-block;background:#eae4d6;border:1px solid #d7cfbc;border-radius:6px;
  padding:1px 6px;font-size:11px;line-height:1.6;font-weight:800;color:#5d6b74;margin:0 1px}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:13.5px;text-align:left;line-height:1.45}
.fb.ok{background:#e2f5ea;color:#186241;border:1px solid #b6e0c9}
.fb.bad{background:#fdeae8;color:#98291f;border:1px solid #f3c8c3}
.fb b{display:block;font-size:11px;line-height:1.6;letter-spacing:.11em;text-transform:uppercase;margin-bottom:4px}
.src{display:inline-block;background:#0B2A4A;color:#e7c964;font-size:10px;line-height:1.6;font-weight:850;letter-spacing:.12em;
  text-transform:uppercase;padding:4px 10px;border-radius:999px;margin-bottom:6px}

/* ---------- touch ---------- */
#touch{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:14px;right:14px;display:none;justify-content:space-between;
  pointer-events:auto;align-items:flex-end}
#touch.on{display:flex}
.tb{width:66px;height:66px;border-radius:50%;background:rgba(7,24,43,.62);border:1.5px solid rgba(201,162,39,.45);
  color:#f0e6cc;font-size:21px;font-weight:800;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.tb:active,.tb.on{background:rgba(201,162,39,.5);color:#07182b}
#tJ{width:78px;height:78px;font-size:25px}
.tb.duck{width:70px;height:58px;font-size:11px;letter-spacing:.12em;font-weight:850}
</style>
</head>
<body>
<div id="wrap">
<div id="stage">
<canvas id="c" width="960" height="576"></canvas>
<div id="hud">
  <div class="grp">
    <span class="chip"><span id="hearts"></span></span>
    <span class="chip"><span class="k">Bank</span><span id="coins">0</span></span>
    <span class="chip" id="whoChip" style="display:none"><span class="k">Runner</span><span id="who"></span></span>
    <span class="chip" id="comboChip" style="display:none"><span class="k">Chain</span><span id="combov">0×</span></span>
    <span class="chip" id="powChip" style="display:none"><span class="k">Loadout</span><span id="powv"></span></span>
  </div>
  <div class="grp">
    <span class="chip" id="srcChip" style="display:none"><span class="k">Lesson</span><span id="srcv"></span></span>
    <span class="chip"><span class="k">Floor</span><span id="pips"></span></span>
    <span class="chip"><span class="k">Best</span><span id="bestv">0</span></span>
    <span class="chip"><span class="k">Score</span><span id="sc">0</span></span>
  </div>
</div>
</div>
<div id="ov"><div class="card" id="card"></div></div>
<div id="touch">
  <div style="display:flex;gap:10px"><button class="tb" id="tL">&#9664;</button><button class="tb" id="tR">&#9654;</button></div>
  <div style="display:flex;gap:10px;align-items:flex-end">
    <button class="tb duck" id="tD">DUCK</button>
    <button class="tb" id="tJ">&#9650;</button>
  </div>
</div>
<div id="rot">Turn your phone sideways for the full floor</div>
</div>
<script>
(function(){
"use strict";
/* ============================================================================
   TUNNEL RUN — Waterman College / The Quad
   A side-scrolling floor run. Every level ends at a fork: two tunnels, one
   question, and the answer you believe decides which mouth you drop into.

   Structure of this file
     1. Question bank
     2. Tuning constants
     3. Chunk library      — hand-authored level pieces, 12 rows of ASCII each
     4. Level builder      — stitches chunks into one long floor
     5. Simulation         — player physics, entities, hazards, the fork
     6. Rendering          — parallax backdrop, tiles, entities, runner, signage
     7. Shell              — HUD, cards, input, resize, loop
   ==========================================================================*/

/* ---------------------------------------------------------------- 1. bank */
const BANK = [
["lang-socks","A Client asks about the socks. How do you present them?","They're a great add-on if you want them.","They're a Solution Component that protects comfort every hour.","right","Solution Component — not an optional extra.","Add-on language separates the system.","Complete Solution"],
["partial","Support in one pair, unsupported 16 hours…","They haven't solved the problem — only part of it.","That's an extra conversation for later.","left","Partial Solution is incomplete.","Extra puts the rest of the day outside the Solution.","Complete Solution"],
["brooks","What job do Brooks Ghost & Adrenaline do?","Premium upsell after the supports.","They carry the correction into shoes the Client wears most.","right","Supports work when footwear works with them.","Name the job, not the transaction.","Complete Solution"],
["cart","How should you handle supports, shoes, socks, MedMassager?","Present every piece deliberately — Rolex-level care.","Set them down quickly so you can keep talking.","left","Careless handling makes $525 feel like $20.","Messy cart = discount bin.","Non-Tangible Value"],
["wrap","In W.R.A.P., what does W — Why — do?","Help them understand the need. Educate.","Pitch the price and 3-Step immediately.","left","W = Why: understand the need first.","Price first skips trust.","W.R.A.P."],
["ready","What is R — Ready — in W.R.A.P.?","Ask if they can afford it before they stand.","Build enthusiasm — let them feel the lift.","right","Ready taps emotion: feel the lift.","Money before feeling kills Ready.","W.R.A.P."],
["yelp","Delighted Client leaving. Yelp?","Ask for a five-star Yelp review.","Let them know you're on Yelp — never ask.","right","Yelp prohibits soliciting reviews.","Never ask for a Yelp review.","Reviews"],
["3step","The 3-Step System is…","One pair plus optional extras.","Three pairs: Strengthener, Maintainer, Relaxer — as a system.","right","Worn together as a system.","A single pair is partial.","Product Knowledge"],
["strength","Strengthener's job?","Workhorse — repositions foot, four arches, longest adjustment.","Mild support, any shoe, little adjustment.","left","Strengtheners reposition the foot.","That's a Relaxer.","Product Knowledge"],
["dress","Walk-in: \"Do you carry dress shoes?\" First move:","No, we don't stock those.","I'd love to help. What are you hoping to find?","right","Don't say no. Ask, seat, imprint.","No kills the conversation.","Inquiries"],
["gold","Client: \"My feet kill me by lunch.\" You should…","Stay quiet — that is gold.","Jump in with the 3-Step before they finish.","left","Stay quiet when they give gold.","Interrupting gold is a pitfall.","Inquiries"],
["push","Investment higher than expected. FIRST:","Remove the most expensive component.","Reconnect to the goal before changing the Solution.","right","Never step down first — reconnect.","Pulling pieces trains padding.","Complete Solution"],
["classic","Most popular Strengthener?","Classic — metatarsal support, heel-pain relief.","Max — thinnest, little adjustment.","left","Classic is most popular for heel pain.","Max is firmest, not thinnest.","Product Knowledge"],
["wow","A WOW Moment happens when a guest…","Feels heard and cared for — real relief or hope.","Buys the full system and leaves quickly.","left","WOW = Empathy + Expertise + Experience.","Speed-to-close is not a WOW.","WOW Moments"],
["educate","People want to be ______, not sold.","Entertained — short and flashy.","Educated — they sell themselves if you educate.","right","Educated, not sold.","Flash without education is a pitch.","WOW Moments"],
["incent","Offer a gift for a review?","Yes, if the fitting was great.","Never — on any platform.","right","Never incentivize reviews.","Prohibited on all platforms.","Reviews"]
].map(r => ({ id:r[0], prompt:r[1], left:r[2], right:r[3], correct:r[4], why:r[5], bad:r[6], src:r[7] }));

/* ------------------------------------------------------- 2. tuning knobs */
const T = 32;               // tile size
const ROWS = 18;            // world is exactly one screen tall (18 * 32 = 576)
const VIEW_W = 960, VIEW_H = 576;
const ZOOM = 1.55;                  // the runner has to read as a person, not a speck
const VW = VIEW_W / ZOOM;           // world units visible across
const VH = VIEW_H / ZOOM;           // world units visible down
const FLOOR_ROW = 15;               // the row every ground strip sits on
const DEEP = 17 * T;                // camera never drops below this: no dead ground
const TOP_ROWS = 6;         // rows 0-5 are always open sky; chunks author 6-17
const FLOORS = 5;           // floors per run
const CHUNKS_PER_FLOOR = 16;
const BASE_HEARTS = 3;
const HEART_CAP = 5;
const MAX_HEARTS = BASE_HEARTS; // default; kit.heartsMax can raise it

const GRAV = 0.58;
const JUMP = -11.2;         // apex ~108px: clears a 3-tile step with room
const JUMP2 = -10.0;        // double jump
const JUMP3 = -9.2;         // third jump (loadout)
const SPRING = -16.4;
const RUN = 4.3;            // top speed
const ACCEL = 0.62;
const FRICTION = 0.80;
const MAX_FALL = 15;
const COYOTE = 6;
const BUFFER = 8;
const IFRAMES = 90;         // invulnerable frames after a hit
const STAND_H = 34;
const DUCK_H = 18;
const STOMP = -9.8;         // bounce after landing on a walk-in

            p walker walk-in   b hopping closer   r rolling closer
            f floating objection
            z sliding spike rail (jump over)   Z hanging saw (duck under)
            k popping floor pin   T hanging chart (drops)
            H heart
   Jump on a walk-in / closer / objection from above to stomp it.
   Side-check still hurts. Hold Down / S to duck and slide.
   Every chunk must open and close on solid ground so pieces stitch cleanly. */

/* ------------------------------------------------- 4. the level builder */
const rnd = (n) => Math.random() * n;
const ri  = (n) => Math.random() * n | 0;
const pick = (a) => a[ri(a.length)];
const shuffle = (a) => { const x = a.slice(); for (let i = x.length - 1; i > 0; i--) { const j = ri(i + 1); [x[i], x[j]] = [x[j], x[i]]; } return x; };

const blankCols = (n) => Array.from({ length: ROWS }, () => Array(n).fill(" "));

/* flat ground strip, n columns wide */
function strip(n) {
  const g = blankCols(n);
  for (let x = 0; x < n; x++) { g[15][x] = "#"; g[16][x] = "#"; g[17][x] = "#"; }
  return g;
}

/* turn a 12-row chunk into a full-height column block */
function chunkGrid(ch) {
  const g = blankCols(ch.w);
  for (let r = 0; r < ch.rows.length; r++) {
    const line = ch.rows[r];
    for (let x = 0; x < ch.w; x++) g[TOP_ROWS + r][x] = line[x] || " ";
  }
  return g;
}

function paste(dest, src, at) {
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < src[y].length; x++) dest[y][at + x] = src[y][x];
  return at + src[0].length;
}

/* Which tier of chunk belongs at slot i of floor fi. Heat ramps both across
   the run and across each individual floor, with a breather every 5th piece. */
function tierFor(fi, i) {
  if (i > 0 && i % 5 === 4) return 0;
  const acrossRun   = FLOORS > 1 ? fi / (FLOORS - 1) : 1;
  const acrossFloor = CHUNKS_PER_FLOOR > 1 ? i / (CHUNKS_PER_FLOOR - 1) : 1;
  const heat = acrossRun * 0.62 + acrossFloor * 0.44;
  return heat < 0.34 ? 1 : heat < 0.78 ? 2 : 3;
}

function buildFloor(fi, q) {
  /* --- choose the pieces ------------------------------------------------ */
  const byTier = { 0: [], 1: [], 2: [], 3: [] };
  CHUNKS.forEach(c => byTier[c.tier].push(c));
  const aid = byTier[0].find(c => c.name === "aid-station");
  const breather = byTier[0].find(c => c.name === "breather");
  const named = {};
  CHUNKS.forEach(c => { named[c.name] = c; });

  /* Guarantee the new toys show up so a floor isn't all coin-arcs.
     Slot 1 and slot 6 sit between rest stops. */
  const MUST = [
    ["patrol-yard", "walk-ins"],
    ["spike-rail", "duck-bar"],
    ["stomp-line", "pop-run"],
    ["hang-chart", "hop-yard"],
    ["thwomp-gauntlet", "low-rail"]
  ];
  const forced = MUST[fi] || [];

  const order = [];
  let lastName = "", usedAid = false, breathers = 0;
  for (let i = 0; i < CHUNKS_PER_FLOOR; i++) {
    const tier = tierFor(fi, i);
    if (tier === 0) {
      breathers++;
      const c = (!usedAid && breathers === 2) ? aid : breather;
      if (c === aid) usedAid = true;
      order.push(c); lastName = c.name; continue;
    }
    if (i === 1 && named[forced[0]]) { order.push(named[forced[0]]); lastName = forced[0]; continue; }
    if (i === 6 && named[forced[1]]) { order.push(named[forced[1]]); lastName = forced[1]; continue; }
    const pool = byTier[tier].filter(c => c.name !== lastName && forced.indexOf(c.name) < 0);
    const c = pick(pool.length ? pool : byTier[tier]);
    order.push(c); lastName = c.name;
  }

  /* --- lay them out ----------------------------------------------------- */
  const INTRO = 12, LINK = 5, APPROACH = 14, FORK = 18;
  let cols = INTRO + APPROACH + FORK;
  order.forEach(c => cols += c.w + LINK);

  const tiles = blankCols(cols);
  const checkpointCols = [], layout = [];
  let x = paste(tiles, strip(INTRO), 0);
  order.forEach((c, i) => {
    layout.push({ name: c.name, tier: c.tier, from: x, to: x + c.w });
    x = paste(tiles, chunkGrid(c), x);
    const link = strip(LINK);
    // a raised flag every few pieces: somewhere to come back to
    if (i === 4 || i === 9 || i === 13) checkpointCols.push(x + 2);
    x = paste(tiles, link, x);
  });

  /* the run-up: guaranteed solid, hazard-free, so the fork is always reachable */
  const approachAt = x;
  x = paste(tiles, strip(APPROACH), x);

  /* --- the fork --------------------------------------------------------- */
  const F = x;
  const fork = strip(FORK);
  const AX = 3, BX = 10, MOUTH = 3;             // opening positions inside the fork
  for (let k = 0; k < MOUTH; k++) {
    fork[15][AX + k] = fork[16][AX + k] = fork[17][AX + k] = " ";
    fork[15][BX + k] = fork[16][BX + k] = fork[17][BX + k] = " ";
  }
  for (let y = 13; y <= 17; y++) { fork[y][AX + MOUTH + 2] = "#"; fork[y][AX + MOUTH + 3] = "#"; }  // divider between mouths
  for (let y = 6; y <= 17; y++) { fork[y][FORK - 2] = "#"; fork[y][FORK - 1] = "#"; }              // closed shutter
  paste(tiles, fork, F);

  /* --- pull the entities out of the grid -------------------------------- */
  const coins = [], springs = [], crumbles = [], movers = [], patrols = [], hearts = [];
  const sliders = [], crushers = [], poppers = [];
  const solidBelow = (cx, cy) => cy + 1 < ROWS && tiles[cy + 1][cx] === "#";
  const pieceAt = (col) => layout.find(L => col >= L.from && col < L.to);
  const chunkSpan = (col) => {
    const p = pieceAt(col);
    return p ? [p.from, p.to - 1] : [col, col];
  };
  const expand = (cx, y, needGround) => {
    const range = chunkSpan(cx);
    let lo = cx, hi = cx;
    while (lo > range[0] && tiles[y][lo - 1] === " " && (!needGround || solidBelow(lo - 1, y))) lo--;
    while (hi < range[1] && tiles[y][hi + 1] === " " && (!needGround || solidBelow(hi + 1, y))) hi++;
    return [lo, hi];
  };

  const marks = [];
  for (let y = 0; y < ROWS; y++) for (let cx = 0; cx < cols; cx++) {
    const t = tiles[y][cx], px = cx * T, py = y * T;
    if (t === "o") { coins.push({ x: px + 8, y: py + 8, w: 16, h: 16, got: 0, ph: rnd(6.28) }); tiles[y][cx] = " "; }
    else if (t === "H") { hearts.push({ x: px + 6, y: py + 7, w: 20, h: 18, got: 0 }); tiles[y][cx] = " "; }
    else if (t === "s") { springs.push({ x: px + 3, y: py + T - 14, w: T - 6, h: 14, comp: 0 }); tiles[y][cx] = " "; }
    else if (t === "c") { crumbles.push({ x: px, y: py, w: T, h: 12, hit: 0, gone: 0 }); tiles[y][cx] = " "; }
    else if (t === "m") { movers.push({ kind: "h", x: px, y: py + 10, w: 3 * T, h: 12, a: px, b: px + 7 * T, sp: 1.15 + rnd(0.5), dir: 1 }); tiles[y][cx] = " "; }
    else if (t === "M") { movers.push({ kind: "v", x: px, y: py + 10, w: 3 * T, h: 12, a: py + 10 - 5 * T, b: py + 10, sp: 1.05 + rnd(0.4), dir: -1 }); tiles[y][cx] = " "; }
    else if (t === "p" || t === "b" || t === "r" || t === "f" || t === "z" || t === "Z" || t === "k" || t === "T") {
      marks.push({ t, cx, y, px, py });
      tiles[y][cx] = " ";
    }
  }
  const kindOf = { p: "walk", b: "hop", r: "roll", f: "float" };
  for (const m of marks) {
    const { t, cx, y, px, py } = m;
    if (kindOf[t]) {
      const [lo, hi] = expand(cx, y, t !== "f");
      const hop = t === "b", roll = t === "r", flt = t === "f";
      patrols.push({
        kind: kindOf[t],
        x: px, y: py + (flt ? 0 : 4), w: roll ? 30 : 28, h: roll ? 24 : 28,
        ox: px, oy: py + (flt ? 0 : 4),
        a: lo * T, b: Math.max(lo * T + 28, (hi + 1) * T - 28),
        sp: (roll ? 2.15 : hop ? 0.85 : flt ? 1.05 : 1.05) + rnd(0.35),
        dir: 1, t: 0, flat: 0, face: 1, vy: hop ? -7.2 : 0
      });
    } else if (t === "z" || t === "Z") {
      const hang = t === "Z";
      const [lo, hi] = expand(cx, y, !hang);
      const w = hang ? 56 : 48, h = hang ? 42 : 26;
      sliders.push({
        hang, x: px - (hang ? 12 : 0), y: py + (hang ? 2 : 6), w, h,
        ox: px - (hang ? 12 : 0),
        a: lo * T, b: Math.max(lo * T + w, (hi + 1) * T - w),
        sp: (hang ? 1.55 : 1.85) + rnd(0.4), dir: hang ? -1 : 1, t: 0
      });
    } else if (t === "k") {
      poppers.push({ x: px + 4, y: py, w: T - 8, h: T, home: py, phase: ri(70), on: 0, warn: 0 });
    } else if (t === "T") {
      crushers.push({ x: px - 12, w: 56, h: 28, home: py, y: py, state: "idle", wait: 0, t: 0 });
    }
  }
  const checkpoints = checkpointCols.map(cc => ({ x: cc * T, y: 13 * T, w: T, h: 2 * T, on: 0 }));

  return {
    q, tiles, cols, rows: ROWS, layout,
    W: cols * T, H: ROWS * T,
    coins, springs, crumbles, movers, patrols, sliders, crushers, poppers, hearts, checkpoints,
    spawn: { x: 2 * T, y: 13 * T },
    approachX: approachAt * T,
    zoneX: (F - 7) * T,                       // where the world starts to slow
    forkX: F * T,
    mouthA: { x: (F + AX) * T, w: MOUTH * T },
    mouthB: { x: (F + BX) * T, w: MOUTH * T },
    flip: Math.random() < 0.5,
    answered: 0, cleared: 0
  };
}

/* Which written answer sits above a given tunnel, and is it the right one? */
function answerFor(W, tunnel) {
  const swap = W.flip;
  if (tunnel === "A") return swap ? "right" : "left";
  return swap ? "left" : "right";
}
function textFor(W, tunnel) { return W.q[answerFor(W, tunnel)]; }
function correctTunnel(W) { return answerFor(W, "A") === W.q.correct ? "A" : "B"; }

    const ny = P.y - (STAND_H - DUCK_H);
    const x0 = Math.floor(P.x / T), x1 = Math.floor((P.x + P.w - 1) / T);
    const y0 = Math.floor(ny / T);
    let blocked = false;
    for (let cx = x0; cx <= x1; cx++) if (isSolid(cx, y0)) blocked = true;
    if (!blocked) { P.duck = 0; P.y = ny; P.h = STAND_H; }
  }

  /* ---- feel ------------------------------------------------------------ */
  P.sq += (1 - P.sq) * 0.16;
  if (P.gnd) P.run += Math.abs(P.vx) * 0.115; else P.run += 0.05;
  if (P.gnd && Math.abs(P.vx) > 2.4 && tick % 7 === 0) dust(P.x + 12, P.y + P.h, 2);
  if (Math.abs(P.vx) > 3.5) {
    P.trail.push({ x: P.x, y: P.y, f: P.face });
    if (P.trail.length > 5) P.trail.shift();
    const tr = currentTrail();
    if (tr && tr.color && tick % 2 === 0) {
      parts.push({ x: P.x + 12, y: P.y + P.h - 6, vx: -P.face * 1.4, vy: -0.35,

    }
  } else if (P.trail.length) P.trail.shift();

  if (activePower === "magnet") {
    for (const c of W.coins) {
      if (c.got) continue;
      const dx = (P.x + P.w / 2) - (c.x + 8), dy = (P.y + P.h / 2) - (c.y + 8);
      const d = Math.sqrt(dx * dx + dy * dy);

    }
  }

    burst(c.x + 8, c.y + 8, "#f0cd55", 9, 4.5, 3);
    popTxt(c.x - 4, c.y - 10, "+1", "#f6dc7f");

    if (streak === 10 && !cartBonus) {

    h.got = 1;
    if (hearts < heartSlots) { hearts++; hud(true); } else { score += 120; hud(); }
    burst(h.x + 10, h.y + 9, "#ff8f86", 16, 5, 4);
    popTxt(h.x, h.y - 8, "heart");
    tune([{ f: 392, d: 0.08 }, { f: 523, d: 0.12, vol: 0.055 }]);
  }
  for (const k of W.checkpoints) if (!k.on && P.x + P.w > k.x) {
    k.on = 1; checkpoint = { x: k.x, y: k.y };
    burst(k.x + 16, k.y + 20, "#C9A227", 18, 5, 6);
    shout("Locked in", "Floor save");
    tune([{ f: 392, d: 0.08 }, { f: 523, d: 0.1 }, { f: 659, d: 0.14, vol: 0.055 }]);
  }

  /* ---- hazards --------------------------------------------------------- */
  {
    const x0 = Math.floor(P.x / T), x1 = Math.floor((P.x + P.w - 1) / T);
    const y0 = Math.floor(P.y / T), y1 = Math.floor((P.y + P.h - 1) / T);
    for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) {
      const t = tileAt(cx, cy);
      if (t === "^" && aabb(pbox(), { x: cx * T + 6, y: cy * T + 13, w: T - 12, h: 19 })) { hurt("Spikes on the floor."); return; }
      if (t === "v" && aabb(pbox(), { x: cx * T + 7, y: cy * T, w: T - 14, h: 19 })) { hurt("Spikes overhead."); return; }
    }
  }
  for (const q of W.patrols) {
    if (q.flat > 0) continue;
    const box = { x: q.x + 3, y: q.y + (q.kind === "float" ? 4 : 8), w: q.w - 6, h: q.h - 10 };
    if (!aabb(pbox(), box)) continue;
    const who = q.kind === "roll" ? "A rolling closer clipped you."
      : q.kind === "hop" ? "A hopping closer clipped you."
      : q.kind === "float" ? "An objection floated into you."
      : "A walk-in clipped you.";
    hurt(who); return;
  }
  for (const s of W.sliders) {
    const box = s.hang
      ? { x: s.x + 6, y: s.y + 4, w: s.w - 12, h: s.h - 10 }
      : { x: s.x + 5, y: s.y + 8, w: s.w - 10, h: s.h - 8 };
    if (aabb(pbox(), box)) {
      hurt(s.hang ? "A hanging saw caught you." : "A spike rail caught you."); return;
    }
  }
  for (const c of W.crushers) {
    if (aabb(pbox(), { x: c.x + 6, y: c.y + 6, w: c.w - 12, h: c.h - 8 })) {
      hurt("A hanging chart dropped."); return;
    }
  }
  for (const p of (W.poppers || [])) {
    if (!p.on) continue;
    if (aabb(pbox(), { x: p.x + 2, y: p.y + 10, w: p.w - 4, h: p.h - 10 })) {
      hurt("A floor pin popped."); return;
    }
  }

  /* ---- the fork, and the long drop ------------------------------------- */
  if (P.y > 15.1 * T) {
    const mid = P.x + P.w / 2;
    if (mid > W.mouthA.x && mid < W.mouthA.x + W.mouthA.w) { startDrop("A"); return; }
    if (mid > W.mouthB.x && mid < W.mouthB.x + W.mouthB.w) { startDrop("B"); return; }
  }
  if (P.y > W.H + 24) { hurt("Off the floor."); return; }

  /* ---- camera ---------------------------------------------------------- */
  /* at the fork the whole sign has to be on screen, so the camera stops
     chasing the runner and frames the two mouths instead */
  const want = P.x > W.zoneX ? W.forkX + 288 - VW / 2 : P.x - VW * 0.38 + P.face * 58;
  cam += (want - cam) * (P.x > W.zoneX ? 0.05 : 0.09);
  if (cam < 0) cam = 0;
  if (cam > W.W - VW) cam = W.W - VW;
  const wantY = P.x > W.zoneX ? DEEP - VH : P.y - VH * 0.55;
  camY += (wantY - camY) * 0.07;
  if (camY < 0) camY = 0;
  if (camY > DEEP - VH) camY = DEEP - VH;

  if (tick % 90 === 0) report(score);
}

function doStomp(q, held) {

  const boost = ((held ? 1.16 : 1) + Math.min(combo - 1, 4) * 0.08) * lift;
  P.vy = STOMP * boost; P.gnd = 0; P.jumps = 1; P.sq = 0.70;

const hash = (n) => { n = (n << 13) ^ n; return ((n * (n * n * 15731 + 789221) + 1376312589) & 0x7fffffff) / 0x7fffffff; };

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function wrapText(text, maxW) {
  const words = String(text).split(/\s+/), lines = [];
  let line = "";
  function flush() { if (line) { lines.push(line); line = ""; } }
  function pushChunk(chunk) {
    const t = line ? line + " " + chunk : chunk;
    if (ctx.measureText(t).width <= maxW) { line = t; return; }
    if (line) flush();
    if (ctx.measureText(chunk).width <= maxW) { line = chunk; return; }
    let rest = chunk;
    while (rest && ctx.measureText(rest).width > maxW) {
      let cut = rest.length - 1;
      while (cut > 1 && ctx.measureText(rest.slice(0, cut)).width > maxW) cut--;
      lines.push(rest.slice(0, cut));
      rest = rest.slice(cut);
    }
    line = rest;
  }
  for (const wd of words) pushChunk(wd);
  flush();
  return lines.length ? lines : [""];
}

/* ---- terrain ----------------------------------------------------------- */
function drawTiles() {
  const c0 = Math.max(0, Math.floor(cam / T) - 1);
  const c1 = Math.min(W.cols - 1, Math.ceil((cam + VW) / T) + 1);
  for (let cx = c0; cx <= c1; cx++) for (let cy = 0; cy < ROWS; cy++) {
    const t = W.tiles[cy][cx]; if (t === " ") continue;
    const px = cx * T, py = cy * T;
    if (t === "#") {
      const sc = currentScene();
      const g = ctx.createLinearGradient(0, py, 0, py + T);
      g.addColorStop(0, sc.tile0); g.addColorStop(1, sc.tile1);
      ctx.fillStyle = g; ctx.fillRect(px, py, T, T);
      ctx.fillStyle = "rgba(0,0,0,.20)"; ctx.fillRect(px, py + T - 3, T, 3);
      ctx.fillStyle = "rgba(255,255,255,.045)"; ctx.fillRect(px, py, 2, T);
      if (!isSolid(cx, cy - 1)) {

        cg.addColorStop(0, "#e2bc48"); cg.addColorStop(1, "#a8871d");
        ctx.fillStyle = cg; ctx.fillRect(px, py, T, 4);
        ctx.fillStyle = "rgba(255,244,214,.5)"; ctx.fillRect(px, py, T, 1);
        ctx.fillStyle = "rgba(201,162,39,.13)"; ctx.fillRect(px, py + 4, T, 7);

function drawMouth(m, letter) {

function drawRunner(x, y, face, phase, grounded, sq, alpha) {
  const look = currentLook();

function drawPlayer() {
  if (!P) return;
  /* ground shadow */
  let sy = P.y + P.h;
  for (let cy = Math.floor((P.y + P.h) / T); cy < ROWS; cy++) {
    if (isSolid(Math.floor((P.x + P.w / 2) / T), cy)) { sy = cy * T; break; }
    sy = ROWS * T;
  }
  const dist = Math.min(1, Math.max(0, (sy - (P.y + P.h)) / 220));
  ctx.fillStyle = "rgba(2,10,20," + (.36 * (1 - dist)) + ")";
  ctx.beginPath(); ctx.ellipse(P.x + 12, sy - 2, 14 * (1 - dist * .45), 4.2 * (1 - dist * .5), 0, 0, 6.3); ctx.fill();

  if (tr && tr.color) {
    P.trail.forEach((t, i) => {

      ctx.fillStyle = tr.color;
      ctx.beginPath();
      ctx.ellipse(t.x + 12, t.y + P.h - 3, 11, 4.2, 0, 0, 6.3);
      ctx.fill();

  if (shieldOn) {
    ctx.strokeStyle = "rgba(201,162,39," + (0.35 + 0.25 * Math.abs(Math.sin(tick * 0.12))) + ")";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(P.x + 12, P.y + P.h * 0.45, 17, 22, 0, 0, 6.3); ctx.stroke();
  }
  if (activePower === "magnet") {
    ctx.strokeStyle = "rgba(127,212,255," + (0.18 + 0.12 * Math.abs(Math.sin(tick * 0.09))) + ")";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(P.x + 12, P.y + P.h * 0.5, 28 + (tick % 24) * 0.4, 0, 6.3); ctx.stroke();
  }
  const duckSq = P.duck ? 0.62 : 1;
  drawRunner(P.x, P.y, P.face, P.run, P.gnd, P.sq * duckSq, 1);
  const nm = (kit.name || "").trim();
  if (nm) {
    ctx.save();
    ctx.font = "800 9px system-ui,sans-serif";
    ctx.textAlign = "center";
    const label = nm.slice(0, 12);
    const tw = Math.min(86, ctx.measureText(label).width + 10);
    const nx = P.x + 12, ny = P.y - 8;
    ctx.fillStyle = "rgba(7,24,43,.78)";
    roundRect(nx - tw / 2, ny - 11, tw, 13, 6); ctx.fill();
    ctx.fillStyle = "#e7c964";
    ctx.fillText(label, nx, ny - 1);
    ctx.textAlign = "left";
    ctx.restore();
  }
}

function drawParticles() {
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.s, p.s);
  }
  ctx.globalAlpha = 1;
  for (let i = pops.length - 1; i >= 0; i--) {
    const n = pops[i];
    n.life--; n.y -= 0.7;
    ctx.globalAlpha = Math.max(0, n.life / 40);
    ctx.fillStyle = n.c; ctx.font = "800 13px system-ui,sans-serif";
    ctx.textAlign = "center"; ctx.fillText(n.t, n.x + 12, n.y);
    ctx.textAlign = "left";
    if (n.life <= 0) pops.splice(i, 1);
  }
  ctx.globalAlpha = 1;
}

/* ---- frame -------------------------------------------------------------- */
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  gY = W ? (15 * T - camY) * ZOOM : 436;
  drawSky(); drawStars(); drawWeather(); drawSkyline(); drawStorefronts(); drawGirders();
  if (!W) { drawIdleGold(); vignette(); drawBanner(); return; }
  const mag = REDUCE ? 0 : (shake * shake) / 18;
  const sx = mag ? (Math.random() - .5) * mag : 0;
  const sy = mag ? (Math.random() - .5) * mag : 0;
  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(ZOOM, ZOOM);
  ctx.translate(-Math.round(cam), -Math.round(camY));
  drawTiles();
  drawProps();
  drawFork();
  drawPlayer();
  drawParticles();
  ctx.restore();
  /* the world dims and cools while you are reading the fork */
  const zoneAmt = 1 - Math.min(1, Math.max(0, (timeScale - .55) / .45));
  if (zoneAmt > .01) {
    ctx.fillStyle = "rgba(6,22,40," + (zoneAmt * .28) + ")";
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }
  vignette();
  if (flash > 0) {
    ctx.fillStyle = flashCol; ctx.globalAlpha = flash / 26;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H); ctx.globalAlpha = 1;
  }
  drawBanner();
}
function drawIdleGold() {
  for (let i = 0; i < 14; i++) {
    const x = (hash(i * 5) * (VIEW_W + 80) + tick * (0.25 + hash(i) * 0.35)) % (VIEW_W + 80) - 40;
    const y = 70 + hash(i * 11) * 320 + Math.sin(tick * 0.02 + i) * 10;
    const spin = Math.cos(tick * 0.06 + i), wid = Math.max(1.4, Math.abs(spin) * 6);
    ctx.globalAlpha = 0.22 + hash(i * 3) * 0.25;
    ctx.fillStyle = "#C9A227";
    ctx.beginPath(); ctx.ellipse(x, y, wid, 6, 0, 0, 6.3); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawBanner() {
  if (!banner || banner.life <= 0) return;
  const k = banner.life / banner.max;
  let a = 1;
  if (k > 0.84) a = (1 - k) / 0.16;
  else if (k < 0.22) a = k / 0.22;
  const y = 72 + (k > 0.84 ? (k - 0.84) * 80 : 0);
  ctx.save();
  ctx.globalAlpha = Math.max(0, Math.min(1, a));
  ctx.textAlign = "center";
  const w = 380, h = banner.s ? 56 : 40;
  ctx.fillStyle = "rgba(7,24,43,.78)";
  roundRect(VIEW_W / 2 - w / 2, y, w, h, 14); ctx.fill();
  ctx.strokeStyle = "rgba(201,162,39,.6)"; ctx.lineWidth = 1.6;
  roundRect(VIEW_W / 2 - w / 2, y, w, h, 14); ctx.stroke();
  ctx.fillStyle = "#f7f4ec";
  ctx.font = "700 22px Georgia,serif";
  ctx.fillText(banner.t, VIEW_W / 2, y + (banner.s ? 26 : 27));
  if (banner.s) {
    ctx.fillStyle = "#e7c964";
    ctx.font = "800 11px system-ui,sans-serif";
    ctx.fillText(banner.s.toUpperCase(), VIEW_W / 2, y + 46);
  }
  ctx.textAlign = "left";
  ctx.restore();
}
function vignette() {
  const v = ctx.createRadialGradient(VIEW_W / 2, VIEW_H / 2, VIEW_H * .42, VIEW_W / 2, VIEW_H / 2, VIEW_H * .95);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(2,8,16,.62)");
  ctx.fillStyle = v; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
}

/* --------------------------------------------------------------- 7. shell */
const HEART_SVG = '<svg viewBox="0 0 24 22"><path d="M12 21S2 14.6 2 7.9A5.6 5.6 0 0 1 12 4.6 5.6 5.6 0 0 1 22 7.9C22 14.6 12 21 12 21z" fill="#e8564c"/></svg>';
const $ = (id) => document.getElementById(id);

function hud(pulse) {
  const hb = $("hearts");
  const slots = Math.max(heartSlots || BASE_HEARTS, hearts, kit.heartsMax);
  if (hb.children.length !== slots) hb.innerHTML = Array.from({ length: slots }, () => '<span class="hp">' + HEART_SVG + '</span>').join("");
  for (let i = 0; i < slots; i++) {
    const n = hb.children[i];
    n.classList.toggle("off", i >= hearts);
    if (pulse) { n.classList.remove("pulse"); void n.offsetWidth; if (i < hearts) n.classList.add("pulse"); }
  }
  const pb = $("pips");
  if (pb.children.length !== FLOORS) pb.innerHTML = Array.from({ length: FLOORS }, () => '<span class="pip"></span>').join("");
  for (let i = 0; i < FLOORS; i++) {
    const n = pb.children[i];
    n.className = "pip" + (i < fi ? " on" : i === fi && mode === "play" ? " now" : "");
  }
  $("coins").textContent = kit.gold;
  $("sc").textContent = score;
  const bv = $("bestv"); if (bv) bv.textContent = best || kit.best || 0;
  const who = $("who"), chip = $("whoChip");
  if (who && chip) {
    const nm = (kit.name || "").trim();
    chip.style.display = nm ? "flex" : "none";
    who.textContent = nm;
  }
  const cc = $("comboChip"), cv = $("combov");
  if (cc && cv) {
    const show = mode === "play" && combo > 1;
    cc.style.display = show ? "flex" : "none";
    cc.classList.toggle("wow", combo >= 4);
    if (show) cv.textContent = combo + "×";
  }
  const pc = $("powChip"), pv = $("powv");
  if (pc && pv) {
    let lab = "";
    if (shieldOn) lab = "First-hit pass";
    else if (activePower === "magnet") lab = "Coin pull";
    else if (activePower === "pace") lab = "Pace shoes";
    else if (activePower === "bounce") lab = "Stomp lift";
    else if (activePower === "triple") lab = "Third jump";
    pc.style.display = lab ? "flex" : "none";
    if (lab) pv.textContent = lab;
  }
  const scc = $("srcChip"), sv = $("srcv");
  if (scc && sv) {
    const src = mode === "play" && W && W.q ? W.q.src : "";
    scc.style.display = src ? "flex" : "none";
    if (src) sv.textContent = src;
  }
}
function esc(s) { return String(s).replace(/[&<>"']/g, function (ch) { if (ch === "&") return "\u0026amp;"; if (ch === "<") return "\u0026lt;"; if (ch === ">") return "\u0026gt;"; if (ch === '"') return "\u0026quot;"; return "\u0026#39;"; }); }
function statRow(pairs) {
  return '<div class="stats">' + pairs.map(p => '<div class="stat"><b>' + p[0] + '</b><span>' + p[1] + '</span></div>').join("") + '</div>';
}

function bindCard() {
  card.querySelectorAll("[data-act]").forEach(el => {
    el.onclick = () => shopAct(el.getAttribute("data-act"), el.getAttribute("data-id"));
  });
  const go = $("go"); if (go) go.onclick = startRun;
  const hub = $("hub"); if (hub) hub.onclick = title;
  const lk = $("locker"); if (lk) lk.onclick = () => openShop();
  const inp = $("runnerName");
  if (inp) {
    const saveName = () => {
      kit.name = String(inp.value || "").replace(/[<>]/g, "").slice(0, 18);
      saveKit();
      hud();
    };
    inp.addEventListener("keydown", e => e.stopPropagation());
    inp.addEventListener("keyup", e => e.stopPropagation());
    inp.addEventListener("input", saveName);
    inp.addEventListener("change", saveName);
  }
}

function title() {
  mode = "title"; W = null; P = null; parts = []; fi = 0; hearts = kit.heartsMax; score = 0;
  ov.classList.remove("hid"); card.classList.remove("shop"); hud();
  const worn = currentLook().name;
  const load = activePowerPreview();

  card.innerHTML =
    '<p class="tag">Waterman College · The Quad</p>' +

    '<p class="lead">' + (named ? "Running as <strong>" + esc(named) + "</strong>. " : "") +
      "Bank coins, chain-stomp the floor, and pick the right tunnel. Spend the locker on looks, floors, crowds, and a loadout.</p>" +
    '<div class="rule"></div>' +
    statRow([[kit.gold, "bank"], [worn, "look"], [kit.heartsMax + (kit.spares ? "+" + kit.spares : ""), "hearts"]]) +
    (load ? '<p class="hint">Next run: <strong>' + esc(load) + "</strong></p>" : "") +
    boardHtml() +
    '<button class="btn gold" id="go">Start the run</button>' +
    '<button class="btn ghost" id="locker">Open the locker</button>' +
    '<p class="hint"><span class="keys">A</span><span class="keys">D</span> run · ' +
    '<span class="keys">Space</span> jump · on a card, Space hits the gold button · ' +
    '<span class="keys">↓</span> duck / slide</p>';

}

function activePowerPreview() {
  if (kit.equip && (kit.powers[kit.equip] | 0) > 0) {
    const p = POWERS.find(x => x.id === kit.equip);
    return p ? p.name : "";
  }
  if (kit.spares > 0) return kit.spares + " spare heart" + (kit.spares > 1 ? "s" : "") + " packed";
  return "";
}

function openShop() {
  ov.classList.remove("hid");
  card.classList.add("shop");
  renderShop();
}

function catalogShelf(list, owned, wearing, buyAct, wearAct, swatchFn) {
  return list.map(l => {
    const have = owned.indexOf(l.id) >= 0;
    const on = wearing === l.id;
    const btn = on ? '<button class="btn slim" disabled>Wearing</button>'
      : have ? '<button class="btn slim gold" data-act="' + wearAct + '" data-id="' + l.id + '">Wear</button>'
      : kit.gold >= l.cost ? '<button class="btn slim gold" data-act="' + buyAct + '" data-id="' + l.id + '">Buy · ' + l.cost + '</button>'
      : '<button class="btn slim" disabled>' + l.cost + '</button>';
    return '<div class="item' + (on ? " have" : "") + '"><div><h3>' + esc(l.name) + '</h3><p>' + esc(l.blurb) + '</p>' +
      (swatchFn ? swatchFn(l) : "") + '</div>' + btn + '</div>';
  }).join("");
}

function renderShop() {
  const tabs = [["looks", "Looks"], ["floor", "Floor"], ["crowd", "Crowd"], ["wake", "Wake"], ["lives", "Lives"], ["kit", "Loadout"]];
  let body = "";
  if (shopTab === "looks") {
    body = catalogShelf(LOOKS, kit.unlocked, kit.look, "buy-look", "wear", l =>
      '<div class="swatch"><i style="background:' + l.hat + '"></i><i style="background:' + l.jacket + '"></i><i style="background:' + l.shirt[0] + '"></i><i style="background:' + l.shoe + '"></i></div>');
  } else if (shopTab === "floor") {
    body = catalogShelf(SCENES, kit.scenes, kit.scene, "buy-scene", "wear-scene", l =>
      '<div class="swatch"><i style="background:' + l.sky[2] + '"></i><i style="background:' + l.tile0 + '"></i><i style="background:' + l.shop + '"></i><i style="background:' + "#C9A227" + '"></i></div>');
  } else if (shopTab === "crowd") {
    body = catalogShelf(CROWD, kit.crowds, kit.crowd, "buy-crowd", "wear-crowd", l =>
      '<div class="swatch"><i style="background:' + l.jacket0 + '"></i><i style="background:' + l.jacket1 + '"></i><i style="background:' + l.badge + '"></i><i style="background:' + l.shoe + '"></i></div>');
  } else if (shopTab === "wake") {
    body = catalogShelf(TRAILS, kit.trails, kit.trail, "buy-trail", "wear-trail", l =>
      '<div class="swatch"><i style="background:' + (l.color || "#d7cfbc") + '"></i></div>');
  } else if (shopTab === "lives") {
    const nextHeart = kit.heartsMax < 4 ? 4 : kit.heartsMax < HEART_CAP ? 5 : 0;
    const heartCost = nextHeart === 4 ? 250 : 450;
    const heartBtn = !nextHeart ? '<button class="btn slim" disabled>Maxed</button>'
      : kit.gold >= heartCost ? '<button class="btn slim gold" data-act="buy-heart">Buy · ' + heartCost + '</button>'
      : '<button class="btn slim" disabled>' + heartCost + '</button>';
    const spareBtn = kit.spares >= 3 ? '<button class="btn slim" disabled>Packed 3</button>'
      : kit.gold >= 75 ? '<button class="btn slim gold" data-act="buy-spare">Buy · 75</button>'
      : '<button class="btn slim" disabled>75</button>';
    body =
      '<div class="item' + (kit.heartsMax >= 4 ? " have" : "") + '"><div><h3>' + (nextHeart ? nextHeart + "th heart slot" : "Heart slots") + '</h3><p>' +
        (nextHeart ? "Permanent. Every run starts with " + nextHeart + " hearts." : "You already run with " + kit.heartsMax + " hearts.") +
        '</p></div>' + heartBtn + '</div>' +
      '<div class="item"><div><h3>Spare heart</h3><p>Packed for the next run only. You have ' + kit.spares + ' waiting.</p></div>' + spareBtn + '</div>';
  } else {
    body = POWERS.map(p => {
      const n = kit.powers[p.id] | 0;
      const on = kit.equip === p.id && n > 0;
      const buy = kit.gold >= p.cost
        ? '<button class="btn slim gold" data-act="buy-power" data-id="' + p.id + '">Buy · ' + p.cost + '</button>'
        : '<button class="btn slim" disabled>' + p.cost + '</button>';
      const wear = n > 0
        ? (on ? '<button class="btn slim" data-act="unequip">Equipped ×' + n + '</button>'
              : '<button class="btn slim gold" data-act="equip" data-id="' + p.id + '">Equip ×' + n + '</button>')
        : buy;
      return '<div class="item' + (on ? " have" : "") + '"><div><h3>' + esc(p.name) + '</h3><p>' + esc(p.blurb) + (n && on ? "" : n ? " · " + n + " packed" : "") + '</p></div><div style="display:flex;gap:6px;flex-direction:column;align-items:stretch">' + wear + (n > 0 ? buy : "") + '</div></div>';
    }).join("");
  }
  card.innerHTML =
    '<div class="shop-top"><div><p class="tag" style="margin:0">Locker</p><h2 style="margin:2px 0 0">Spend the floor</h2></div>' +
    '<span class="shop-gold">' + kit.gold + ' banked</span></div>' +
    '<div class="named"><label for="runnerName">Runner</label>' +
      '<input id="runnerName" maxlength="18" autocomplete="off" spellcheck="false" placeholder="Name your runner" value="' + esc(kit.name || "") + '"></div>' +
    '<p class="hint" style="margin-top:8px">Coins you grab stay even if you drop. Looks, floors, crowds, and wakes are yours. Loadouts fire on the next start.</p>' +
    '<div class="tabs">' + tabs.map(t => '<button class="tab' + (shopTab === t[0] ? " on" : "") + '" data-act="tab" data-id="' + t[0] + '">' + t[1] + '</button>').join("") + '</div>' +
    '<div class="shelf">' + body + '</div>' +
    (shopNote ? '<p class="toast">' + esc(shopNote) + '</p>' : '') +
    '<button class="btn ghost" data-act="back">Back</button>';
  hud();
  bindCard();
}

function wearOrBuy(list, ownedKey, wearKey, id) {
  const item = list.find(x => x.id === id);
  if (!item) return;
  if (kit[ownedKey].indexOf(id) < 0) {
    if (kit.gold < item.cost) { shopNote = "Need " + item.cost + " in the bank."; renderShop(); return; }
    kit.gold -= item.cost;
    kit[ownedKey].push(id);
    shopNote = item.name + " unlocked. You are wearing it.";
    beep(784, 0.1, "square", 0.06);
  } else {
    shopNote = "Wearing " + item.name + ".";
    beep(660, 0.08, "triangle", 0.05);
  }
  kit[wearKey] = id;
  saveKit();
  renderShop();
}

function shopAct(act, id) {
  shopNote = "";
  if (act === "tab") { shopTab = id; renderShop(); return; }
  if (act === "back") { card.classList.remove("shop"); if (mode === "win") return showWin(); if (mode === "over") return showOver(); title(); return; }
  if (act === "wear") {
    if (kit.unlocked.indexOf(id) >= 0) { kit.look = id; saveKit(); shopNote = "Wearing " + LOOKS.find(l => l.id === id).name + "."; beep(660, 0.08, "triangle", 0.05); }
    renderShop(); return;
  }
  if (act === "buy-look") {
    const l = LOOKS.find(x => x.id === id);
    if (!l || kit.unlocked.indexOf(id) >= 0) return;
    if (kit.gold < l.cost) { shopNote = "Need " + l.cost + " in the bank."; renderShop(); return; }
    kit.gold -= l.cost; kit.unlocked.push(id); kit.look = id; saveKit();
    shopNote = l.name + " unlocked. You are wearing it."; beep(784, 0.1, "square", 0.06);
    renderShop(); return;
  }
  if (act === "buy-scene" || act === "wear-scene") return wearOrBuy(SCENES, "scenes", "scene", id);
  if (act === "buy-crowd" || act === "wear-crowd") return wearOrBuy(CROWD, "crowds", "crowd", id);
  if (act === "buy-trail" || act === "wear-trail") return wearOrBuy(TRAILS, "trails", "trail", id);
  if (act === "buy-heart") {
    const next = kit.heartsMax < 4 ? 4 : kit.heartsMax < HEART_CAP ? 5 : 0;
    const cost = next === 4 ? 250 : 450;
    if (!next) return;
    if (kit.gold < cost) { shopNote = "Need " + cost + " in the bank."; renderShop(); return; }
    kit.gold -= cost; kit.heartsMax = next; saveKit();
    shopNote = "Runs now start with " + next + " hearts."; beep(784, 0.1, "square", 0.06);
    renderShop(); return;
  }
  if (act === "buy-spare") {
    if (kit.spares >= 3) return;
    if (kit.gold < 75) { shopNote = "Need 75 in the bank."; renderShop(); return; }
    kit.gold -= 75; kit.spares++; saveKit();
    shopNote = "Spare packed. Next run starts with one extra heart."; beep(700, 0.09, "square", 0.05);
    renderShop(); return;
  }
  if (act === "buy-power") {
    const p = POWERS.find(x => x.id === id);
    if (!p) return;
    if (kit.gold < p.cost) { shopNote = "Need " + p.cost + " in the bank."; renderShop(); return; }
    kit.gold -= p.cost;
    kit.powers[id] = (kit.powers[id] | 0) + 1;
    kit.equip = id;
    saveKit();
    shopNote = p.name + " packed and equipped for the next run."; beep(740, 0.09, "square", 0.05);
    renderShop(); return;
  }
  if (act === "equip") {
    if ((kit.powers[id] | 0) > 0) { kit.equip = id; saveKit(); shopNote = "Equipped for the next run."; }
    renderShop(); return;
  }
  if (act === "unequip") { kit.equip = null; saveKit(); shopNote = "Loadout cleared."; renderShop(); }
}

function resolveFork(tunnel) {
  const good = answerFor(W, tunnel) === W.q.correct;
  answered++;
  if (good) correct++;
  let gained = 150;                                  /* floor cleared */
  if (good) gained += 200;
  if (good && cleanFloor) gained += 100;
  if (!good) { hearts--; hud(true); }
  score += gained; report(score); hud();

  if (!good && hearts <= 0) { gameOver(W.q.bad); return; }

  const last = fi + 1 >= FLOORS;
  mode = "lesson"; ov.classList.remove("hid");
  card.innerHTML =
    '<span class="src">' + esc(W.q.src) + '</span>' +
    '<h2>' + (good ? "Right tunnel" : "Wrong tunnel") + '</h2>' +
    '<div class="fb ' + (good ? "ok" : "bad") + '"><b>' + (good ? "Why that one" : "What that costs") + '</b>' +
      esc(good ? W.q.why : W.q.bad) + '</div>' +
    statRow([[(good ? "+" : "+") + gained, "this floor"], [score, "score"], [correct + "/" + answered, "correct"]]) +
    (good && cleanFloor ? '<p class="hint">Clean floor — no damage taken. +100.</p>' : "") +
    (!good ? '<p class="hint">One heart down. ' + hearts + ' left.</p>' : "") +
    '<button class="btn gold" id="go">' + (last ? "Finish the run" : "Next floor →") + '</button>';
  $("go").onclick = () => {
    if (last) return win();
    loadFloor(fi + 1); mode = "play"; ov.classList.add("hid");
  };
}

function win() {
  if (mode !== "win") {
    winBonus = hearts * 150;
    score += winBonus; report(score);
    newBest = recordRun();
    mode = "win";
    shout(perfectTitle(), newBest ? "New personal best" : "Campus clear");
    tune([{ f: 523, d: 0.09 }, { f: 659, d: 0.09 }, { f: 784, d: 0.09 }, { f: 1046, d: 0.2, vol: 0.06 }]);
  }
  showWin();
}
function perfectTitle() {
  return correct === FLOORS ? "Every tunnel" : "Campus clear";
}
function showWin() {
  ov.classList.remove("hid"); card.classList.remove("shop"); hud();
  const perfect = correct === FLOORS;
  card.innerHTML =
    '<p class="tag">Campus clear</p>' +
    '<h2>' + (perfect ? "Every tunnel, first try" : "All five floors behind you") + '</h2>' +
    (runnerName() !== "Rookie" || (kit.name || "").trim() ? '<p class="lead">' + esc(runnerName()) + " cleared campus.</p>" : "") +
    statRow([[score, "score"], [correct + "/" + FLOORS, "tunnels"], [coins, "this run"], [kit.gold, "bank"]]) +
    boardHtml() +
    '<p class="hint">' + (winBonus ? "Hearts carried to the end: +" + winBonus + ". " : "") +
      (newBest ? "New personal best." : "Personal best " + best + ".") +
      ' Coins from this run are already in the bank. Space runs it again.</p>' +
    '<button class="btn gold" id="go">Run it again</button>' +
    '<button class="btn ghost" id="locker">Open the locker</button>' +
    '<button class="btn ghost" id="hub">Back to the title</button>';
  bindCard();
}

function gameOver(reason) {
  if (mode === "over") { showOver(); return; }
  lastOver = reason || "The floor got you.";
  mode = "over"; report(score);
  newBest = recordRun();
  showOver();
}
function showOver() {
  ov.classList.remove("hid"); card.classList.remove("shop"); hud();
  card.innerHTML =
    '<p class="tag">Out of hearts</p>' +
    '<h2>Run over on floor ' + (fi + 1) + '</h2>' +
    '<p class="lead">' + esc(lastOver) + '</p>' +
    statRow([[score, "score"], [correct + "/" + answered, "correct"], [coins, "this run"], [kit.gold, "bank"]]) +
    boardHtml() +
    '<p class="hint">' + (newBest ? "That is your best run so far. " : "Best so far " + best + ". ") +
      'You keep every coin you banked. Space hits Try again.</p>' +
    '<button class="btn gold" id="go">Try again</button>' +
    '<button class="btn ghost" id="locker">Open the locker</button>' +
    '<button class="btn ghost" id="hub">Back to the title</button>';
  bindCard();
}

/* ---- input -------------------------------------------------------------- */
const HELD = ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " ", "w", "W", "a", "A", "d", "D", "s", "S"];
function typingInField(el) {
  if (!el) return false;
  const tag = (el.tagName || "").toUpperCase();
  return tag === "INPUT" || tag === "TEXTAREA" || el.isContentEditable;
}
window.addEventListener("keydown", e => {
  if (typingInField(e.target)) return;
  const space = e.key === " " || e.code === "Space" || e.key === "Spacebar";
  if ((space || e.key === "Enter") && mode !== "play") {
    e.preventDefault();
    const go = document.getElementById("go");
    if (go) go.click();
    return;
  }
  keys.add(e.key);
  if (HELD.indexOf(e.key) >= 0) e.preventDefault();
});
window.addEventListener("keyup", e => { if (!typingInField(e.target)) keys.delete(e.key); });
window.addEventListener("blur", () => { keys.clear(); tL = tR = tJ = tD = 0; });
function bindTouch(el, set) {
  const on = v => e => { e.preventDefault(); set(v); el.classList.toggle("on", !!v); };
  el.addEventListener("touchstart", on(1), { passive: false });
  el.addEventListener("touchend", on(0)); el.addEventListener("touchcancel", on(0));
  el.addEventListener("mousedown", on(1)); el.addEventListener("mouseup", on(0)); el.addEventListener("mouseleave", on(0));
}
bindTouch($("tL"), v => tL = v); bindTouch($("tR"), v => tR = v); bindTouch($("tJ"), v => tJ = v);
bindTouch($("tD"), v => tD = v);

/* ---- fit ---------------------------------------------------------------- */
function resize() {
  const pad = 8;
  const s = Math.min((Math.min(window.innerWidth, 1280) - pad) / VIEW_W, (window.innerHeight - pad) / VIEW_H);
  const stage = $("stage");
  stage.style.width = Math.floor(VIEW_W * s) + "px";
  stage.style.height = Math.floor(VIEW_H * s) + "px";
  cv.style.width = Math.floor(VIEW_W * s) + "px";
  cv.style.height = Math.floor(VIEW_H * s) + "px";
  const coarse = window.matchMedia("(pointer:coarse)").matches || window.innerWidth < 900;
  touch.classList.toggle("on", coarse);
}
resize(); window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 120));

/* ---- loop --------------------------------------------------------------- */
let last = performance.now(), acc = 0;
const DT = 1000 / 60;
function frame(now) {
  const dt = Math.min(90, now - last); last = now;
  acc += dt * (mode === "play" ? timeScale : 1);
  let guard = 0;
  while (acc >= DT && guard++ < 6) {
    if (hitStop > 0) { hitStop--; acc -= DT; continue; }
    step(); acc -= DT;
  }
  if (acc > DT * 6) acc = 0;
  draw();
  requestAnimationFrame(frame);
}

/* Test hook. Headless QA drives a run through this instead of clicking the DOM,
   which is far faster and does not depend on canvas coordinates. Read-only
   handles plus two helpers; nothing here changes how the game plays. */
window.__TR = {
  get state() {
    return { mode, fi, hearts, coins, score, correct, answered, timeScale,
      px: P && P.x, py: P && P.y, gnd: P && P.gnd, vx: P && P.vx, vy: P && P.vy,
      duck: P && P.duck, keys: [...keys].join(","), jumps: P && P.jumps,
      world: W && { W: W.W, cols: W.cols, forkX: W.forkX, zoneX: W.zoneX,
        approachX: W.approachX, mouthA: W.mouthA, mouthB: W.mouthB, layout: W.layout,
        coins: W.coins.length, checkpoints: W.checkpoints.length,
        patrols: W.patrols.length, sliders: W.sliders.length, crushers: W.crushers.length,
        poppers: W.poppers && W.poppers.length, q: W.q, flip: W.flip },
      combo, streak, banner: banner && banner.t, gold: kit.gold, look: kit.look, heartsMax: kit.heartsMax, power: activePower, shield: shieldOn,
      scene: kit.scene, crowd: kit.crowd, trail: kit.trail, name: kit.name, best: kit.best };
  },
  get kit() { return kit; },
  get floors() { return floors; },
  get hurts() { return hurtLog; },
  get lastHurt() { return lastHurt; },
  build: buildFloor, chunks: CHUNKS, bank: BANK,
  start: startRun, title: title, load: loadFloor, shop: openShop,
  grant(n) { kit.gold += Math.max(0, n | 0); saveKit(); hud(); return kit.gold; },
  resetKit() { kit = defaultKit(); saveKit(); hud(); return kit; },
  earn: (n) => { earn(n); hud(); return kit.gold; },
  kill(reason) { gameOver(reason || "QA"); },
  bump(n) { score += Math.max(0, n | 0); hud(); return score; },
  setName(n) { kit.name = String(n || "").replace(/[<>]/g, "").slice(0, 18); saveKit(); hud(); return kit.name; },
  warp(x) { if (P) { P.x = x; P.vx = 0; } },
  dropInto(t) { if (mode === "play") startDrop(t); },
  correctTunnel() { return W ? correctTunnel(W) : null; },
  stompAt(i) {
    if (!P || !W || !W.patrols[i]) return false;
    const b = W.patrols[i];
    P.x = b.x; P.y = b.y - P.h - 6; P.vy = 6; P.vx = 0; P.gnd = 0; P.duck = 0; P.h = STAND_H;
    return true;
  }
};
window.__controlsTest = {
  getX: () => P ? P.x : 0,
  getVx: () => P ? P.vx : 0,
  setKeys: (codes) => { keys = new Set(codes || []); }
};

requestAnimationFrame(frame);
title();
})();
</script>
</body>
</html>
