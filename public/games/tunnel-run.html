<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#0B2A4A"/>
<title>Tunnel Run — Waterman College</title>
<script src="/games/quad-bridge.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0B2A4A;color:#f7f4ec;font-family:system-ui,sans-serif;touch-action:none;user-select:none}
#wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;max-width:100%;max-height:100%;box-shadow:0 0 0 2px rgba(201,162,39,.35)}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:10px 14px;font-size:13px;font-weight:700;pointer-events:none;text-shadow:0 1px 2px #000}
.chip{background:rgba(11,42,74,.8);border:1px solid rgba(201,162,39,.45);border-radius:999px;padding:6px 12px}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(11,42,74,.9);padding:20px}
#ov.hid{display:none}
.card{background:#f7f4ec;color:#0f1c24;border-radius:16px;padding:22px;max-width:400px;width:100%;text-align:center}
.card h1,.card h2{font-family:Georgia,serif;color:#0B2A4A;margin:6px 0}
.tag{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#C9A227}
.card p{font-size:14px;color:#5a6b75;margin:8px 0;line-height:1.4}
.prompt{font-size:15px;font-weight:650;color:#0f1c24;margin:12px 0;line-height:1.35}
.btn{display:block;width:100%;min-height:48px;margin-top:10px;border:none;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;background:#0B2A4A;color:#fff}
.btn.gold{background:#C9A227;color:#0B2A4A}
.btn.ghost{background:transparent;color:#0B2A4A;border:1px solid #c5cdd4}
.side{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border:2px solid #d5dee5;border-radius:12px;background:#fff;font-size:14px;cursor:pointer}
.side.ok{border-color:#1f7a4c;background:#d8f3e5}
.side.bad{border-color:#b42318;background:#fde8e6}
.fb{margin-top:10px;padding:10px;border-radius:10px;font-size:13px}
.fb.ok{background:#d8f3e5;color:#1f7a4c}
.fb.bad{background:#fde8e6;color:#b42318}
#touch{position:absolute;bottom:12px;left:12px;right:12px;display:none;justify-content:space-between;pointer-events:auto}
#touch.on{display:flex}
.tb{width:68px;height:68px;border-radius:50%;background:rgba(11,42,74,.7);border:2px solid rgba(201,162,39,.5);color:#fff;font-size:22px;font-weight:800}
.tb:active,.tb.on{background:rgba(201,162,39,.55)}
.hint{font-size:12px;color:#8a9ba6;margin-top:6px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="960" height="540"></canvas>
<div id="hud"><span class="chip">🪙 <span id="coins">0</span></span><span class="chip">Floor <span id="fl">1</span>/5</span><span class="chip">★ <span id="sc">0</span></span></div>
<div id="ov"><div class="card" id="card"></div></div>
<div id="touch"><div><button class="tb" id="tL">◀</button> <button class="tb" id="tR">▶</button></div><button class="tb" id="tJ">▲</button></div>
</div>
<script src="/games/tunnel-run.js"></script>
</body>
</html>
