name: DB backup

# Nightly logical backup of the production Postgres, uploaded as a downloadable
# workflow artifact. Guards against accidental data loss (a bad migration, a
# dropped table, a provider hiccup).
#
# ONE-TIME SETUP — add a repository secret:
#   Settings → Secrets and variables → Actions → New repository secret
#   Name:  DATABASE_URL
#   Value: your Neon DIRECT (unpooled) connection string, e.g.
#          postgresql://USER:PASSWORD@ep-xxxx.REGION.aws.neon.tech/DBNAME?sslmode=require
#   Use the DIRECT endpoint, not the pooled (-pooler) one — pg_dump needs a
#   session-mode connection. Until the secret exists, this job fails on purpose
#   so the missing setup is visible.
#
# Restore a dump locally with:
#   gunzip -c cogs-backup-YYYYMMDD-HHMMSS.sql.gz | psql "$TARGET_DATABASE_URL"

on:
  schedule:
    - cron: "17 8 * * *" # ~08:17 UTC daily (~3am Central) — off-peak
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set. Add it under Settings → Secrets and variables → Actions (see this file's header)."
            exit 1
          fi
          stamp="$(date -u +%Y%m%d-%H%M%S)"
          file="cogs-backup-${stamp}.sql.gz"
          echo "Dumping to ${file}"
          pg_dump "$DATABASE_URL" --no-owner --no-privileges | gzip -9 > "${file}"
          ls -lh "${file}"
          echo "BACKUP_FILE=${file}" >> "$GITHUB_ENV"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
          if-no-files-found: error
