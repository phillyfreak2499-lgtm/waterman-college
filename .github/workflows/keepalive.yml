name: Keep alive

# Render's free web service spins down after ~15 min idle, so the next visitor
# eats a 30-60s cold start. This pings the site every 10 minutes during business
# hours (13:00-03:59 UTC ~= 8am-11pm Central) to keep it warm, and stays idle
# overnight so it fits comfortably inside the free instance-hour allowance.
#
# Not a substitute for the Starter plan (~$7/mo) if you want guaranteed always-on
# — GitHub's scheduled runs are best-effort and can be delayed under load.
# Trigger manually any time from the Actions tab (workflow_dispatch).

on:
  schedule:
    - cron: "*/10 0-3,13-23 * * *"
  workflow_dispatch: {}

# No repository token needed — this only makes an outbound request.
permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Warm the app
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            --max-time 90 --retry 2 --retry-delay 20 --retry-all-errors \
            https://cogs-x7vz.onrender.com/login || echo "000")
          echo "GET /login -> $code"
          # Never fail the run: a slow wake or transient blip shouldn't send a
          # red-X email. The next scheduled ping will try again.
          if [ "$code" = "000" ]; then
            echo "No response yet (the instance may still be waking)."
          fi
